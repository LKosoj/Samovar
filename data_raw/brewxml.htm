var is_program = false;
var program = "";

/**
   * Корректировка округления десятичных дробей.
   *
   * @param {String}  type  Тип корректировки.
   * @param {Number}  value Число.
   * @param {Integer} exp   Показатель степени (десятичный логарифм основания корректировки).
   * @returns {Number} Скорректированное значение.
   */
  function decimalAdjust(type, value, exp) {
    // Если степень не определена, либо равна нулю...
    if (typeof exp === 'undefined' || +exp === 0) {
      return Math[type](value);
    }
    value = +value;
    exp = +exp;
    // Если значение не является числом, либо степень не является целым числом...
    if (isNaN(value) || !(typeof exp === 'number' && exp % 1 === 0)) {
      return NaN;
    }
    // Сдвиг разрядов
    value = value.toString().split('e');
    value = Math[type](+(value[0] + 'e' + (value[1] ? (+value[1] - exp) : -exp)));
    // Обратный сдвиг
    value = value.toString().split('e');
    return +(value[0] + 'e' + (value[1] ? (+value[1] + exp) : exp));
  }
  
function compare( a, b ) {
  var a1 = decimalAdjust("round",get_object_value(a.TIME));
  var b1 = decimalAdjust("round",get_object_value(b.TIME));
  if (a1 < b1){
    return 1;
  }
  if (a1 > b1){
    return -1;
  }
  return 0;
}

// [Пиво 02.09 D7] "повреждён" в тексте ошибки - только когда файл не прошёл разбор XML;
// содержательные ошибки (нет обязательного узла, нет шагов затирания и т.п.) идут как есть.
function formatRecipeErrorMessage(err, kind) {
  if (err && err.xmlSyntaxError) return "Файл рецепта повреждён или не в формате " + kind + ": " + err.message;
  return (err && err.message) ? err.message : String(err);
}

function loadBeerXML(e) {
	var file = e;
	if (!file) return;

	var readtype = new FileReader();
	readtype.onload = function () {
	    if (readtype.result.indexOf("namerecipe") > 0){
			var reader = new FileReader();
			reader.onload = function () {
				try {
					get_brewmate_info(reader.result);
				} catch (err) {
					is_program = false;
					SamovarApp.showRequestError(formatRecipeErrorMessage(err, "BrewMate"));
				}
			};
			reader.onerror = function () {
				SamovarApp.showRequestError('Не удалось прочитать файл рецепта.');
			};
			reader.readAsText(file, "windows-1251");
	    } else {
    		var reader = new FileReader();
			reader.onload = function () {
				try {
					get_brew_info(reader.result);
				} catch (err) {
					is_program = false;
					SamovarApp.showRequestError(formatRecipeErrorMessage(err, "BeerXML"));
				}
			};
			reader.onerror = function () {
				SamovarApp.showRequestError('Не удалось прочитать файл рецепта.');
			};
			reader.readAsText(file, "UTF-8");
	    }
	};
	readtype.onerror = function () {
		SamovarApp.showRequestError('Не удалось прочитать файл рецепта.');
	};
	readtype.readAsText(file, "UTF-8");
}

function parseXml(xml, arrayTags) {
    let dom = null;
    if (window.DOMParser) dom = (new DOMParser()).parseFromString(xml, "text/xml");
    else if (window.ActiveXObject) {
        dom = new ActiveXObject('Microsoft.XMLDOM');
        dom.async = false;
        if (!dom.loadXML(xml)) throw dom.parseError.reason + " " + dom.parseError.srcText;
    }
    else throw new Error("cannot parse xml string!");

    if (dom.getElementsByTagName && dom.getElementsByTagName("parsererror").length > 0) {
        // [Пиво 02.09 D7] помечаем именно синтаксическую поломку XML - только для неё
        // сообщение получает префикс "повреждён" (formatRecipeErrorMessage)
        var xmlErr = new Error("файл повреждён, это не корректный XML.");
        xmlErr.xmlSyntaxError = true;
        throw xmlErr;
    }

    function parseNode(xmlNode, result) {
        if (xmlNode.nodeName == "#text") {
            let v = xmlNode.nodeValue;
            if (v.trim()) result['#text'] = v;
            return;
        }

        let jsonNode = {},
            existing = result[xmlNode.nodeName];
        if (existing) {
            if (!Array.isArray(existing)) result[xmlNode.nodeName] = [existing, jsonNode];
            else result[xmlNode.nodeName].push(jsonNode);
        }
        else {
            if (arrayTags && arrayTags.indexOf(xmlNode.nodeName) != -1) result[xmlNode.nodeName] = [jsonNode];
            else result[xmlNode.nodeName] = jsonNode;
        }

        if (xmlNode.attributes) for (let attribute of xmlNode.attributes) jsonNode[attribute.nodeName] = attribute.nodeValue;

        for (let node of xmlNode.childNodes) parseNode(node, jsonNode);
    }

    let result = {};
    for (let node of dom.childNodes) parseNode(node, result);

    return result;
}

function isArray(myArray) {
  // checks for null and undefined
  if (myArray == null) {
    return false;
  }
  return Symbol.iterator in Object(myArray);
}

function isNumeric(str) {
  if (typeof str != "string") return false // we only process strings!  
  return !isNaN(str) && // use type coercion to parse the _entirety_ of the string (`parseFloat` alone does not do this)...
         !isNaN(parseFloat(str)) // ...and ensure strings of whitespace fail
}

function get_object_value(Obj, str = "", exp = -2){
    if (typeof Obj != "undefined") {
      if (isNumeric(Obj["#text"])) return (decimalAdjust("round",parseFloat(Obj["#text"]),exp)) + str;
      else if (typeof Obj["#text"] != "undefined") return Obj["#text"] + str;
            else return "Нет в рецепте";
    }
    else return "Нет в рецепте";
}

function check_value(val, type){
  if (val != "Нет в рецепте") return val;
  if (type == "bt") return 60;
  if (type == "pt") return 20;
}

function asList(node) {
  if (node == null) return [];
  return Array.isArray(node) ? node : [node];
}

function present(obj, exp) {
  var v = (typeof exp === "number") ? get_object_value(obj, "", exp) : get_object_value(obj);
  return (v === "Нет в рецепте") ? "" : String(v);
}

function pickPresent() {
  for (var i = 0; i < arguments.length; i++) {
    if (arguments[i] && arguments[i] !== "Нет в рецепте") return arguments[i];
  }
  return "Нет в рецепте";
}

function setSpec(id, value, hideIfMissing) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = value;
  var row = el.closest(".spec-row");
  if (!row) return;
  var missing = (value === "Нет в рецепте" || value === "");
  row.style.display = (hideIfMissing && missing) ? "none" : "";
}

function withDisplayUnit(value, unit) {
  if (!value || value === "Нет в рецепте") return value;
  var s = String(value);
  if (/[A-Za-zА-Яа-я%]/.test(s)) return s;
  return s + unit;
}

function kgFromGrams(node) {
  var v = present(node, -6);
  if (!v) return node;
  var n = parseFloat(v);
  if (!Number.isFinite(n)) return node;
  return { "#text": String(n / 1000) };
}

function mapBrewMateHopUse(raw) {
  var s = String(raw).trim().toLowerCase();
  if (s === "boil" || s === "кипячение" || s === "варка") return "Boil";
  if (s === "first wort" || s === "первое сусло" || s === "fwh") return "First Wort";
  if (s === "mash" || s === "затирание") return "Mash";
  if (s === "aroma" || s === "аромат" || s === "вирпул" || s === "whirlpool") return "Aroma";
  if (s === "dry hop" || s === "dryhop" || s === "сухое охмеление") return "Dry Hop";
  return "";
}

function fermentableTypeLabel(type) {
  var t = String(type).trim().toLowerCase();
  if (t === "adjunct") return "Добавка";
  if (t === "sugar") return "Сахар";
  if (t === "extract") return "Экстракт";
  if (t === "dry extract") return "Сухой экстракт";
  return "Солод";
}

function miscTypeLabel(type) {
  var t = String(type).trim().toLowerCase();
  if (t === "flavor") return "Вкус";
  if (t === "fining") return "Очистка";
  if (t === "spice") return "Специи";
  if (t === "herb") return "Травы";
  if (t === "water agent") return "Вода";
  if (t === "other") return "Прочее";
  return present({ "#text": type }) || "Прочее";
}

function usePhaseLabel(use) {
  var s = String(use).trim().toLowerCase();
  if (s === "boil") return "Кипячение";
  if (s === "first wort") return "Первое сусло";
  if (s === "mash") return "Затирание";
  if (s === "aroma") return "Аромат";
  if (s === "dry hop") return "Сухое охмеление";
  if (s === "primary") return "Брожение";
  if (s === "secondary") return "Дображивание";
  if (s === "bottling") return "Розлив";
  return use;
}

function hopUseLabel(hop) {
  var user = present(hop.USER_HOP_USE).trim().toLowerCase();
  if (user === "whirlpool") return "Вирпул";
  if (user) return usePhaseLabel(present(hop.USER_HOP_USE));
  return usePhaseLabel(present(hop.USE));
}

function hopFormLabel(form) {
  var f = String(form).trim().toLowerCase();
  if (f === "pellet") return "пеллеты";
  if (f === "leaf") return "шишки";
  if (f === "plug") return "пробки";
  return form;
}

function formatHopTime(hop) {
  var raw = present(hop.TIME, 0);
  if (!raw) return "";
  var n = parseFloat(raw);
  if (!Number.isFinite(n)) return raw;
  var use = (present(hop.USER_HOP_USE) || present(hop.USE)).trim().toLowerCase();
  if (use.indexOf("dry") >= 0 && n >= 1440) return decimalAdjust("round", n / 1440, -1) + " сут";
  return decimalAdjust("round", n, 0) + " мин";
}

function formatAmount(item, kind) {
  var display = present(item.DISPLAY_AMOUNT);
  if (display) return display;
  var raw = present(item.AMOUNT, -6);
  if (!raw) return "";
  var n = parseFloat(raw);
  if (!Number.isFinite(n)) return raw;
  var flag = present(item.AMOUNT_IS_WEIGHT).toLowerCase();
  var weight = (kind === "hop" || kind === "ferm" || flag === "true");
  if (kind === "yeast" || kind === "misc") weight = (flag === "true");
  if (!weight) {
    if (Math.abs(n) >= 1) return decimalAdjust("round", n, -2) + " л";
    return decimalAdjust("round", n * 1000, -1) + " мл";
  }
  if (Math.abs(n) >= 1) return decimalAdjust("round", n, -2) + " кг";
  return decimalAdjust("round", n * 1000, -1) + " г";
}

function joinDetails(parts) {
  var out = [];
  for (var i = 0; i < parts.length; i++) {
    if (parts[i]) out.push(parts[i]);
  }
  return out.join(", ");
}

function appendCol(row, className, text) {
  var el = document.createElement("label");
  el.className = className;
  el.textContent = text;
  row.appendChild(el);
}

function appendIng(parent, type, name, amount, detail) {
  var row = document.createElement("div");
  row.className = "ingredients";
  appendCol(row, "ingType", type);
  appendCol(row, "ingName", name);
  appendCol(row, "ingAmount", amount);
  appendCol(row, "ingDetail", detail || "");
  parent.appendChild(row);
}

// [Пиво 02.09 D1] один файл может содержать несколько RECIPE - показываем выбор,
// если их больше одного, и разбираем выбранный узел через get_recipe(R) (D0).
var recipeList = [];
function presentRecipe(recipeNode) {
  recipeList = Array.isArray(recipeNode) ? recipeNode : [recipeNode];
  var row = document.getElementById("recipe-select-row");
  var select = document.getElementById("recipe-select");
  select.innerHTML = "";
  if (recipeList.length > 1) {
    for (var i = 0; i < recipeList.length; i++) {
      var opt = document.createElement("option");
      opt.value = i;
      var nm = get_object_value(recipeList[i].NAME);
      opt.textContent = (nm !== "Нет в рецепте") ? nm : ("Рецепт " + (i + 1));
      select.appendChild(opt);
    }
    row.style.display = "";
  } else {
    row.style.display = "none";
  }
  selectRecipe(0);
}
function selectRecipe(idx) {
  try { get_recipe(recipeList[idx]); }
  catch (err) { is_program = false; SamovarApp.showRequestError(formatRecipeErrorMessage(err, "BeerXML")); }
}

function get_brew_info(xml){
	let recipe = parseXml(xml);
	if (!recipe.RECIPES || !recipe.RECIPES.RECIPE) {
		throw new Error("не найден обязательный узел RECIPES/RECIPE (это не файл BeerXML).");
	}
	presentRecipe(recipe.RECIPES.RECIPE);
}

function get_brewmate_info(xml){
	let recipe = parseXml(xml);
	if (!recipe.recipe) {
		throw new Error("не найден обязательный узел recipe (это не файл BrewMate).");
	}
	//show main info
	recipe.RECIPES = Object.create(null);
	recipe.RECIPES.RECIPE = Object.create(null);
	recipe.RECIPES.RECIPE.STYLE = Object.create(null);
	recipe.RECIPES.RECIPE.STYLE.NAME = recipe.recipe.style;
	recipe.RECIPES.RECIPE.NAME = recipe.recipe.namerecipe;
	recipe.RECIPES.RECIPE.BREWER = recipe.recipe.author || recipe.recipe.brewer;
	recipe.RECIPES.RECIPE.BATCH_SIZE = recipe.recipe.part;
	recipe.RECIPES.RECIPE.BOIL_SIZE = recipe.recipe.volume;
	recipe.RECIPES.RECIPE.BOIL_TIME = recipe.recipe.timeboil;
	recipe.RECIPES.RECIPE.FERMENTABLE_TIME = recipe.recipe.timebro;
	recipe.RECIPES.RECIPE.PRIMARY_AGE = recipe.recipe.timebro;
	recipe.RECIPES.RECIPE.PRIMARY_TEMP = recipe.recipe.tempbro;
	recipe.RECIPES.RECIPE.EFFICIENCY = recipe.recipe.efficiency || recipe.recipe.kpd;
	recipe.RECIPES.RECIPE.OG = recipe.recipe.np || recipe.recipe.og;
	recipe.RECIPES.RECIPE.FG = recipe.recipe.kp || recipe.recipe.fg;
	recipe.RECIPES.RECIPE.IBU = recipe.recipe.ibu;
	recipe.RECIPES.RECIPE.ABV = recipe.recipe.abv || recipe.recipe.alc;
	recipe.RECIPES.RECIPE.EST_COLOR = recipe.recipe.srm || recipe.recipe.ebc;
	if (recipe.recipe.comms && recipe.recipe.comms.comm) {
		recipe.RECIPES.RECIPE.NOTES = recipe.recipe.comms.comm.lin || recipe.recipe.comms.comm;
	}

	recipe.RECIPES.RECIPE.YEASTS = Object.create(null);
	recipe.RECIPES.RECIPE.YEASTS.YEAST = Object.create(null);
	recipe.RECIPES.RECIPE.YEASTS.YEAST.NAME = recipe.recipe.yeast;
	
	recipe.RECIPES.RECIPE.FERMENTABLES = Object.create(null);
	recipe.RECIPES.RECIPE.FERMENTABLES.FERMENTABLE = recipe.recipe.grains.grain;

    var FERMENTABLE = [];
    if (Array.isArray(recipe.RECIPES.RECIPE.FERMENTABLES.FERMENTABLE)){
       FERMENTABLE = recipe.RECIPES.RECIPE.FERMENTABLES.FERMENTABLE;
    } else {FERMENTABLE.push(recipe.RECIPES.RECIPE.FERMENTABLES.FERMENTABLE) }
    
    for (let ferm of FERMENTABLE){
    	ferm.NAME = ferm.grainname;
    	ferm.AMOUNT = ferm.grainkg;
    	ferm.TYPE = ferm.graintype || ferm.TYPE;
    	ferm.COLOR = ferm.graincolor || ferm.COLOR;
    	ferm.YIELD = ferm.grainyield || ferm.YIELD;
	}

    recipe.RECIPES.RECIPE.HOPS = Object.create(null);
    recipe.RECIPES.RECIPE.HOPS.HOP = recipe.recipe.hops.hop;
    
    var HOP = [];
    if (Array.isArray(recipe.RECIPES.RECIPE.HOPS.HOP)){
       HOP = recipe.RECIPES.RECIPE.HOPS.HOP;
    } else {HOP.push(recipe.RECIPES.RECIPE.HOPS.HOP) }
    for (let hop of HOP){
		hop.NAME = hop.hopname;
		hop.AMOUNT = kgFromGrams(hop.hopgr);
		hop.TIME = hop.hoptime;
		hop.ALPHA = hop.hopalpha || hop.ALPHA;
		hop.FORM = hop.hopform || hop.FORM;
		var hopUse = present(hop.hopuse || hop.use);
		var mappedUse = hopUse ? mapBrewMateHopUse(hopUse) : "";
		if (mappedUse) hop.USE = { "#text": mappedUse };
	}

	recipe.RECIPES.RECIPE.MASH = Object.create(null);
	recipe.RECIPES.RECIPE.MASH.MASH_STEPS = Object.create(null);
	recipe.RECIPES.RECIPE.MASH.MASH_STEPS.MASH_STEP = recipe.recipe.zatirs.zatir;
	
    var MASH = [];
    if (Array.isArray(recipe.RECIPES.RECIPE.MASH.MASH_STEPS.MASH_STEP)){
       MASH = recipe.RECIPES.RECIPE.MASH.MASH_STEPS.MASH_STEP;
    } else {MASH.push(recipe.RECIPES.RECIPE.MASH.MASH_STEPS.MASH_STEP) }
    for (let mash of MASH){
    	mash.STEP_TEMP = mash.zatirgr;
    	mash.STEP_TIME = mash.zatirtime;
    	mash.NAME = mash.zatirname || mash.NAME;
    	mash.TYPE = mash.zatirtype || mash.TYPE;
    	mash.INFUSE_AMOUNT = mash.zatirwater || mash.INFUSE_AMOUNT;
    }
	
	recipe.RECIPES.RECIPE.MISCS = Object.create(null);
	recipe.RECIPES.RECIPE.MISCS.MISC = recipe.recipe.misc;
	
    var MISC = [];
    if (Array.isArray(recipe.RECIPES.RECIPE.MISCS.MISC)){
       MISC = recipe.RECIPES.RECIPE.MISCS.MISC;
    } else if (!(recipe.RECIPES.RECIPE.MISCS.MISC === undefined)) {MISC.push(recipe.RECIPES.RECIPE.MISCS.MISC) }
    for (let misc of MISC){
		misc.TYPE = misc.misctype;
		misc.NAME = misc.miscname;
		misc.AMOUNT = kgFromGrams(misc.miscgr);
		misc.AMOUNT_IS_WEIGHT = { "#text": "TRUE" };
		misc.USE = misc.miscuse || misc.USE;
		misc.TIME = misc.misctime || misc.TIME;
	}

	presentRecipe(recipe.RECIPES.RECIPE);
}

function get_recipe(R){
    is_program = false;
    program = "";
    setSpec("STYLE", get_object_value(R.STYLE && R.STYLE.NAME), true);
    setSpec("NAME", get_object_value(R.NAME), false);
    setSpec("TYPE", get_object_value(R.TYPE), true);
    setSpec("BREWER", get_object_value(R.BREWER), true);
    setSpec("BATCH_SIZE", get_object_value(R.BATCH_SIZE, " л."), true);
    setSpec("BOIL_SIZE", get_object_value(R.BOIL_SIZE, " л."), true);
    setSpec("BOIL_TIME", get_object_value(R.BOIL_TIME, " мин."), true);
    // [Пиво 02.09 D9] textContent вместо innerHTML - заметки из файла рецепта не должны исполняться как HTML
    var notesText = get_object_value(R.NOTES);
    if (Array.isArray(R.NOTES)) {
      notesText = R.NOTES.map(function (n) { return present(n); }).filter(Boolean).join("\n") || "Нет в рецепте";
    }
    setSpec("NOTES", notesText, true);
    setSpec("PRIMARY_TEMP", get_object_value(R.PRIMARY_TEMP, " °С"), false);
    setSpec("FERMENTABLE_TIME", pickPresent(
      get_object_value(R.FERMENTABLE_TIME, " дней"),
      get_object_value(R.PRIMARY_AGE, " дней")
    ), false);
    setSpec("OG", pickPresent(get_object_value(R.OG, "", -3), get_object_value(R.EST_OG)), true);
    setSpec("FG", pickPresent(get_object_value(R.FG, "", -3), get_object_value(R.EST_FG)), true);
    setSpec("IBU", get_object_value(R.IBU, "", -2), true);
    setSpec("ABV", withDisplayUnit(pickPresent(get_object_value(R.EST_ABV), get_object_value(R.ABV, "", -2)), " %"), true);
    setSpec("COLOR", pickPresent(get_object_value(R.EST_COLOR), get_object_value(R.COLOR, "", -1)), true);
    setSpec("EFFICIENCY", withDisplayUnit(get_object_value(R.EFFICIENCY, "", -1), " %"), true);
    var waterName = "Нет в рецепте";
    if (R.WATERS && R.WATERS.WATER) {
      waterName = get_object_value(asList(R.WATERS.WATER)[0].NAME);
    }
    setSpec("WATER", waterName, true);
    setSpec("EQUIPMENT", get_object_value(R.EQUIPMENT && R.EQUIPMENT.NAME), true);

    var dl = document.createElement("div");
    appendIng(dl, "Тип", "Название", "Количество", "Параметры");

    var ingr = document.getElementById("ingredients");
    ingr.innerHTML = "";
    ingr.appendChild(dl);

    var FERMENTABLE = [];
    if (R.FERMENTABLES && R.FERMENTABLES.FERMENTABLE) {
      FERMENTABLE = asList(R.FERMENTABLES.FERMENTABLE);
    }

    for (let ferm of FERMENTABLE){
      var fermColor = present(ferm.COLOR, -1);
      var fermYield = present(ferm.YIELD, -1);
      appendIng(
        dl,
        fermentableTypeLabel(present(ferm.TYPE)),
        get_object_value(ferm.NAME),
        formatAmount(ferm, "ferm"),
        joinDetails([
          fermColor ? (fermColor + " °L") : "",
          fermYield ? ("выход " + fermYield + " %") : "",
          present(ferm.SUPPLIER)
        ])
      );
    }

    // [Пиво 02.09 D7] хмель в рецепте не обязателен - без узла HOPS список остаётся пустым
    var HOP = [];
    if (R.HOPS && R.HOPS.HOP) {
      HOP = asList(R.HOPS.HOP);
    }
    for (let hop of HOP){
      var hopTemp = present(hop.TEMPERATURE, -1) || present(hop.HOP_TEMP, -1);
      var hopAlpha = present(hop.ALPHA, -1);
      var hopForm = present(hop.FORM);
      appendIng(
        dl,
        "Хмель",
        get_object_value(hop.NAME),
        formatAmount(hop, "hop"),
        joinDetails([
          hopUseLabel(hop),
          formatHopTime(hop),
          hopTemp ? (hopTemp + " °C") : "",
          hopAlpha ? ("α " + hopAlpha + " %") : "",
          hopForm ? hopFormLabel(hopForm) : ""
        ])
      );
    }

    var YEAST = [];
    if (R.YEASTS && R.YEASTS.YEAST) {
      YEAST = asList(R.YEASTS.YEAST);
    }
    for (let yeast of YEAST){
      var lab = present(yeast.LABORATORY);
      var pid = present(yeast.PRODUCT_ID);
      var att = present(yeast.ATTENUATION, -1);
      var tmin = present(yeast.MIN_TEMPERATURE, -1);
      var tmax = present(yeast.MAX_TEMPERATURE, -1);
      var yform = present(yeast.FORM).toLowerCase();
      var yformRu = yform === "dry" ? "сухие" : (yform === "liquid" ? "жидкие" : present(yeast.FORM));
      appendIng(
        dl,
        "Дрожжи",
        get_object_value(yeast.NAME),
        formatAmount(yeast, "yeast"),
        joinDetails([
          [lab, pid].filter(Boolean).join(" "),
          yformRu,
          att ? ("атт. " + att + " %") : "",
          (tmin && tmax) ? (tmin + "–" + tmax + " °C") : (tmin || tmax ? ((tmin || tmax) + " °C") : "")
        ])
      );
    }

    var MISC = [];
    if (R.MISCS && R.MISCS.MISC) {
      MISC = asList(R.MISCS.MISC);
    }
    for (let misc of MISC){
      appendIng(
        dl,
        miscTypeLabel(present(misc.TYPE)),
        get_object_value(misc.NAME),
        formatAmount(misc, "misc"),
        joinDetails([
          usePhaseLabel(present(misc.USE)),
          formatHopTime(misc)
        ])
      );
    }
    
    //show mash step
    var dl = document.createElement("div");
    var dl1 = document.createElement("div");
    dl1.className = "ingredients";
  
    var name = document.createElement("label");
    name.textContent = "Название";
    name.className = "mashName";
    dl1.appendChild(name);
    var descr = document.createElement("label");
    descr.textContent = "Тип";
    descr.className = "mashType";
    dl1.appendChild(descr);
    var mtemp = document.createElement("label");
    mtemp.textContent = "Температура";
    mtemp.className = "mashTemp";
    dl1.appendChild(mtemp);
    var mtime = document.createElement("label");
    mtime.textContent = "Время";
    mtime.className = "mashTime";
    dl1.appendChild(mtime);
    var mwater = document.createElement("label");
    mwater.textContent = "Вода";
    mwater.className = "mashWater";
    dl1.appendChild(mwater);
    dl.appendChild(dl1);

    //mash
    // [Пиво 02.09 D7] без шагов затирания программу не построить - явная ошибка вместо TypeError
    if (!R.MASH || !R.MASH.MASH_STEPS || !R.MASH.MASH_STEPS.MASH_STEP) {
      throw new Error("в рецепте нет шагов затирания");
    }
    var MASH = asList(R.MASH.MASH_STEPS.MASH_STEP);
    var brewOrder = SamovarApp.beerBrewOrder(SamovarApp.currentBeerBrewOrderId());

    // [Пиво 02.09 D4] температура первой строки M - INFUSE_TEMP первого шага затирания, иначе его STEP_TEMP, иначе 45
    var mTemp = get_object_value(MASH[0].INFUSE_TEMP);
    if (mTemp === "Нет в рецепте") mTemp = get_object_value(MASH[0].STEP_TEMP);
    if (mTemp === "Нет в рецепте") mTemp = "45.00";
    program = SamovarApp.beerProgramRow("M", mTemp, "0", brewOrder.mashDevice, String(brewOrder.mashSensor)) + "\n";

    var mashSteps = [];
    for (let mash of MASH){
	  var dl1 = document.createElement("div");
      dl1.className = "ingredients";
  
      var name = document.createElement("label");
      name.textContent = get_object_value(mash.NAME)
      name.className = "mashName";
      dl1.appendChild(name);
      var type = document.createElement("label");
      type.textContent = get_object_value(mash.TYPE)
      type.className = "mashType";
      dl1.appendChild(type);
      var step_temp = document.createElement("label");
      step_temp.textContent = get_object_value(mash.STEP_TEMP)
      step_temp.className = "mashTemp";
      dl1.appendChild(step_temp);
      var step_time = document.createElement("label");
      step_time.textContent = get_object_value(mash.STEP_TIME)
      step_time.className = "mashTime";
      dl1.appendChild(step_time);
      var infuse = document.createElement("label");
      var infuseAmt = present(mash.INFUSE_AMOUNT, -2);
      infuse.textContent = infuseAmt ? (infuseAmt + " л") : "";
      infuse.className = "mashWater";
      dl1.appendChild(infuse);

      dl.appendChild(dl1);
      mashSteps.push({
        type: get_object_value(mash.TYPE),
        name: get_object_value(mash.NAME),
        temp: step_temp.textContent,
        time: step_time.textContent,
        infuseAmount: infuseAmt,
        infuseTemp: present(mash.INFUSE_TEMP, -2),
        decoctionAmount: present(mash.DECOCTION_AMOUNT, -2)
      });
    }
    var mashBuilt = SamovarApp.buildBeerMashStageLines(mashSteps, brewOrder.id);
    if (mashBuilt.error) {
      throw new Error(mashBuilt.error);
    }
    if (mashBuilt.lines.length) program = program + mashBuilt.lines.join("\n") + "\n";
    var hintsBox = document.getElementById("mash-order-hints");
    if (hintsBox) {
      var hintLines = ["Варочный порядок из настроек: " + brewOrder.label + ". " + brewOrder.hint].concat(mashBuilt.hints);
      hintsBox.textContent = hintLines.join("\n");
    }

    var ingr = document.getElementById("mash");
    ingr.innerHTML = "";
    ingr.appendChild(dl);
    
    pt = check_value(get_object_value(R.PRIMARY_TEMP), "pt");

    // [Пиво 02.09 D2] в кипячение попадают только хмели с USE Boil/First Wort (Dry Hop и т.п. не варятся)
    var boilHop = HOP.filter(function (hop) {
      var use = get_object_value(hop.USE);
      if (use === "Нет в рецепте") return true; // BrewMate / USE отсутствует - как раньше
      use = String(use).trim().toLowerCase();
      return use === "boil" || use === "first wort";
    });

    // [Пиво 02.09 D3] одинаковое TIME сворачивается в одну строку B; хмель с TIME == BOIL_TIME не даёт лишнюю "B;0.00;1"
    bth = decimalAdjust("round", check_value(get_object_value(R.BOIL_TIME), "bt"));
    boilHop.sort(compare);
    var lastTime = null;
    for (var i = 0; i < boilHop.length; i++) {
      var t = decimalAdjust("round", get_object_value(boilHop[i].TIME));
      if (!Number.isFinite(t) || t > bth) continue;
      if (t === lastTime) continue;
      lastTime = t;
      if (bth - t > 0) program = program + "B;0.00;" + (bth - t) + ";1^-1^2^3;0\n";
      bth = t;
    }
    if (bth > 0) program = program + "B;0.00;" + bth + ";1^-1^2^3;0\n";

    // [Пиво 02.09 D5] мешалка на кипячении/выводе не крутится
    program = program + "C;" + pt + ";0;0^0^0^0;0\nF;" + pt + ";0;0^0^0^0;0";

    var err = validateBeerProgramText(program);
    if (err) {
        is_program = false;
        throw new Error("рецепт не даёт корректную программу (" + err + ")");
    }
    is_program = true;
}

// Ограничения соответствуют разбору формата beer на прошивке (program_io.h, program_types.h):
// PROGRAM_MAX = CAPACITY_NUM*2 = 20 строк, допустимые типы строки - allowedTypes формата beer,
// температура - PROGRAM_TEMP_MIN..MAX, время шага - PROGRAM_TIME_MIN..MAX (в минутах).
var BEER_PROGRAM_MAX_ROWS = SamovarApp.beerProgramMaxRows;
var BEER_PROGRAM_TYPES = "MPBCFWLA";

function validateBeerProgramText(text) {
  var lines = text.split("\n");
  while (lines.length > 0 && lines[lines.length - 1] === "") lines.pop();
  if (lines.length === 0) return "в рецепте нет ни одного шага";
  if (lines.length > BEER_PROGRAM_MAX_ROWS) {
    return "шагов " + lines.length + ", максимум " + BEER_PROGRAM_MAX_ROWS;
  }
  for (var i = 0; i < lines.length; i++) {
    var n = i + 1;
    var f = lines[i].split(";");
    if (f.length !== 5) {
      return "шаг " + n + ": повреждена структура строки программы";
    }
    if (f[0].length !== 1 || BEER_PROGRAM_TYPES.indexOf(f[0]) === -1) {
      return "шаг " + n + ": неизвестный тип «" + f[0] + "»";
    }
    var temp = Number(f[1]);
    if (!Number.isFinite(temp) || temp < 0 || temp > 150) {
      return "шаг " + n + ": температура «" + f[1] + "» не число от 0 до 150 (проверьте STEP_TEMP/PRIMARY_TEMP в файле рецепта)";
    }
    var time = Number(f[2]);
    if (!Number.isFinite(time) || time < 0 || time > 1440) {
      return "шаг " + n + ": время «" + f[2] + "» не число от 0 до 1440 минут (проверьте STEP_TIME/BOIL_TIME в файле рецепта)";
    }
    // [Пиво 02.09 D6] структура устройства и семантика строки - общее правило SamovarApp.beerRowTypeOk
    var device = f[3].split("^").map(Number);
    var deviceValid = device.length === 4 && device.every(Number.isFinite);
    var noDevice = deviceValid && device[0] === 0 && device[1] === 0 && device[2] === 0 && device[3] === 0;
    var scheduledDevice = deviceValid && device[0] >= 1 && device[0] <= 3 && device[2] > 0;
    if (!noDevice && !scheduledDevice) {
      return "шаг " + n + ": повреждена структура устройства «" + f[3] + "»";
    }
    var sensor = Number(f[4]);
    if (!SamovarApp.beerRowTypeOk(f[0], temp, time, noDevice, sensor)) {
      return "шаг " + n + ": для типа «" + f[0] + "» температура/время/устройство не соответствуют правилам (temp=" + temp + ", time=" + time + ")";
    }
  }
  return "";
}

async function set_program(){
  if (!is_program) {
    alert("Рецепт не сформирован.");
    return;
  }
  document.getElementById("WProgram").value = program;
  try {
    let result = await SamovarApp.postProgram(document.forms.mainform);
    if (!result.ok) { alert(result.err || 'Программа не установлена'); return; }
    alert("Программа сохранена.");
  } catch (e) {
    alert('Ошибка сети: ' + e);
  }
};

SamovarApp.initTheme();
document.addEventListener('DOMContentLoaded', function () {
  SamovarApp.initTheme();
  fetch('/ajax?messageCursor=0').then(function (resp) {
    if (!resp.ok) return null;
    return resp.json();
  }).then(function (data) {
    if (data && data.BeerBrewOrder) SamovarApp.setConfiguredBeerBrewOrder(data.BeerBrewOrder);
  }).catch(function () {});
});
</script>
