<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=7.00u9">
<title>Самовар — I2CStepper</title>
<script src="app.js"></script>
<script>
const I2C_RUNNING = 1;
const I2C_CAP_RELAY = 8;
const I2C_CAP_FILLING = 4;
const I2C_RELAY_COUNT = 4;
let selectedAddress = Number(new URLSearchParams(location.search).get('address')) || 0;
let devices = [];
let selected = null;
let refreshTimer = 0;
let commandInFlight = false;
let speedFieldLoaded = false;
let refreshErrorShown = false;
let manualHold = 0;
let processInfo = {};

function deviceName(device) {
  return device.address & 1 ? 'Мешалка' : 'Насос';
}

function selectedUrl(command) {
  const params = new URLSearchParams({address: String(selectedAddress)});
  if (command) params.set('cmd', command);
  return '/i2cstepper?' + params;
}

function field(id) {
  return document.getElementById(id);
}

function render() {
  const present = devices.filter(device => device.present);
  const selectorRow = field('selectorRow');
  const selector = field('selector');
  selectorRow.hidden = present.length < 2;
  selector.replaceChildren();
  present.forEach(device => {
    const option = document.createElement('option');
    option.value = device.address;
    option.textContent = deviceName(device) + ', адрес ' + device.address;
    option.selected = device.address === selectedAddress;
    selector.append(option);
  });
  if (!selected || !selected.present) {
    field('panel').hidden = true;
    field('missing').hidden = false;
    field('missing').textContent =
      'Выбранный I2CStepper недоступен. Другое устройство не выбрано автоматически.';
    return;
  }
  field('missing').hidden = true;
  field('panel').hidden = false;
  const status = selected.status;
  field('title').textContent = deviceName(selected) + ', адрес ' + selected.address;
  field('state').textContent = status.flags & I2C_RUNNING ? 'Работает' : 'Остановлен';
  // Единицы всегда одни: мешалка - об/мин, насос - л/ч и мл (пересчёт делает Самовар).
  const mixer = Boolean(selected.address & 1);
  const inProcess = selected.address === Number(mixer ? processInfo.processMixer : processInfo.processPump);
  const programSpeed = inProcess && (Number(mixer ? processInfo.mixerSpeedOverride : processInfo.pumpRateOverride) || 0);
  const speedNow = Number(processInfo.speedNow) || 0;
  field('now').textContent = 'Скорость: ' + speedNow + (mixer ? ' об/мин' : ' л/ч; осталось: ' +
    (Number(processInfo.remainingMl) || 0) + ' мл') +
    '; направление: ' + (Number(processInfo.directionNow) ? 'обратное.' : 'прямое.');
  field('speedLabel').textContent = mixer ? 'Скорость, об/мин' : 'Скорость, л/ч';
  field('speed').max = mixer ? '65535' : '65.535';
  field('speed').min = field('speed').step = mixer ? '1' : '0.001';
  // Поле ввода заполняем один раз: иначе автообновление раз в 2 с затирает набранное.
  // «Как в программе» есть только у привода, занятого процессом; список собираем при смене состояния.
  const direction = field('direction');
  if (direction.dataset.inProcess !== String(inProcess)) {
    direction.dataset.inProcess = String(inProcess);
    direction.replaceChildren();
    (inProcess ? [[0, 'как в программе'], [1, 'прямое'], [2, 'обратное']] : [[1, 'прямое'], [2, 'обратное']])
      .forEach(([value, text]) => direction.append(new Option(text, value)));
    direction.value = inProcess ? Number(processInfo.dirOverride) || 0 : (Number(processInfo.directionNow) ? 2 : 1);
  }
  if (!speedFieldLoaded) {
    speedFieldLoaded = true;
    field('speed').value = programSpeed || speedNow || '';
  }
  // Привод занят процессом: новая скорость заменяет программную, объём задаёт программа.
  field('volumeRow').hidden = mixer || inProcess;
  field('start').textContent = inProcess || status.flags & I2C_RUNNING ? 'Применить скорость' : 'Запустить';
  field('speedNote').textContent = !inProcess ? '' : programSpeed
    ? 'Программа работает с заданной здесь скоростью: ' + programSpeed + (mixer ? ' об/мин.' : ' л/ч.')
    : 'Скорость задаёт программа. Новая скорость заменит программную.';
  field('relays').hidden = !(selected.capabilities & I2C_CAP_RELAY);
  for (let relay = 1; relay <= I2C_RELAY_COUNT; relay++) {
    field('relay' + relay).textContent =
      (selected.config.relayMask >> (relay - 1) & 1 ? 'Выключить реле ' : 'Включить реле ') + relay;
  }
  field('resume').hidden = manualHold !== selected.address;
  field('calibrate').hidden = Boolean(selected.address & 1) ||
    !(selected.capabilities & I2C_CAP_FILLING);
}

async function refresh() {
  if (!selectedAddress) return;
  try {
    const response = await fetch(selectedUrl(), {cache: 'no-store'});
    if (!response.ok) throw new Error(await SamovarApp.responseErrorText(
      response, 'I2CStepper недоступен'
    ));
    const payload = await response.json();
    devices = Array.isArray(payload.devices) ? payload.devices : [];
    selected = payload.selected || null;
    manualHold = Number(payload.manualHold) || 0;
    processInfo = payload;
    render();
    // Гасим только свою ошибку: иначе автообновление за 2 с стирает отказ команды.
    if (refreshErrorShown) {
      refreshErrorShown = false;
      SamovarApp.clearRequestError();
    }
  } catch (error) {
    selected = null;
    render();
    refreshErrorShown = true;
    SamovarApp.showRequestError(String(error));
  }
}

// Одна команда на оба случая: свободный привод запускается, занятый процессом меняет скорость.
function startWithSpeed() {
  const mixer = Boolean(selected.address & 1);
  const value = Number(field('speed').value);
  if (!(value > 0)) {
    SamovarApp.showRequestError('Введите скорость больше нуля');
    return Promise.resolve(false);
  }
  const values = {value: Math.round(mixer ? value : value * 1000)};
  // 0 = «как в программе»: параметр не шлём; иначе прошивка ждёт 0 - прямое, 1 - обратное.
  const direction = Number(field('direction').value);
  if (direction) values.direction = direction - 1;
  const volume = Math.round(Number(field('volume').value));
  if (!field('volumeRow').hidden && volume > 0) values.volume = volume;
  return command('speed', values);
}

async function command(command, values) {
  if (commandInFlight || !selected || !selected.present) return false;
  commandInFlight = true;
  try {
    const params = new URLSearchParams({address: String(selectedAddress), cmd: command});
    Object.entries(values || {}).forEach(([key, value]) => params.set(key, value));
    const response = await fetch('/i2cstepper?' + params, {cache: 'no-store'});
    if (!response.ok) throw new Error(await SamovarApp.responseErrorText(
      response, 'Команда не принята'
    ));
    const acceptance = await SamovarApp.readOperationAcceptance(response);
    await SamovarApp.waitForOperation(acceptance.operationId);
    await refresh();
    if (!refreshErrorShown) SamovarApp.clearRequestError();
    return true;
  } catch (error) {
    SamovarApp.showRequestError(String(error));
    return false;
  } finally {
    commandInFlight = false;
  }
}

function toggleRelay(relay) {
  return command('relay', {relay: relay, state: selected.config.relayMask >> (relay - 1) & 1 ? 0 : 1});
}

// Ручной «Стоп»/«Запустить» отбирает мешалку у программы режима до смены строки; это возврат.
async function resumeProgram() {
  try {
    const response = await fetch(selectedUrl('resume'), {cache: 'no-store'});
    if (!response.ok) throw new Error(await SamovarApp.responseErrorText(
      response, 'Команда не принята'
    ));
    await refresh();
  } catch (error) {
    SamovarApp.showRequestError(String(error));
  }
}

function choose() {
  const address = Number(field('selector').value);
  if (Number.isInteger(address)) location.assign('/i2cstepper.htm?address=' + address);
}

async function init() {
  try {
    let bootstrap = null;
    if (!await SamovarApp.loadUiBootstrap(data => { bootstrap = data; })) return;
    devices = Array.isArray(bootstrap.i2cSteppers) ? bootstrap.i2cSteppers : [];
    if (!selectedAddress) {
      const first = devices.find(device => device.present);
      selectedAddress = first ? first.address : 0;
    }
    await refresh();
    if (selectedAddress) {
      refreshTimer = window.setInterval(refresh, 2000);
    }
  } catch (error) {
    SamovarApp.showRequestError(String(error));
  }
}

window.onload = function() {
  SamovarApp.initTheme({dynamicThemeTitle: true, implicitSystemTheme: true});
  init();
};
window.addEventListener('beforeunload', () => {
  clearInterval(refreshTimer);
});
</script>
</head>
<body>
<!--#include ui_page_header.htm-->
    <button type="button" id="themeToggle" class="icon-btn theme-toggle" onclick="SamovarApp.toggleTheme()">☾</button>
  </header>
<main class="i2c-page">
  <h1>I2CStepper</h1>
  <p id="missing" class="card" hidden></p>
  <div id="selectorRow" class="card" hidden>
    <div class="i2c-row"><label for="selector">Устройство</label> <select id="selector" onchange="choose()"></select></div>
  </div>
  <section id="panel" hidden>
    <div class="card">
      <h2 id="title"></h2>
      <div class="kv">
        <div class="wide"><div class="k">Состояние</div><div class="v" id="state"></div></div>
        <div class="wide"><div class="k">Сейчас</div><div class="v v-text" id="now"></div></div>
      </div>
    </div>
    <div class="card">
      <h2>Управление</h2>
      <div class="i2c-row"><label id="speedLabel" for="speed">Скорость</label> <input id="speed" type="number"></div>
      <div class="hint" id="speedNote"></div>
      <div class="i2c-row"><label for="direction">Направление</label> <select id="direction"></select></div>
      <div id="volumeRow">
        <div class="i2c-row"><label for="volume">Объём, мл</label> <input id="volume" type="number" min="1" max="100000"></div>
        <div class="hint">Пусто — качать без остановки; на ходу — докачать остаток.</div>
      </div>
      <div class="i2c-actions">
        <button id="start" type="button" class="button" onclick="startWithSpeed()">Запустить</button>
        <!-- window.: внутри onclick кнопки имя command занято её собственным свойством (атрибут command), а не нашей функцией. -->
        <button type="button" class="button" onclick="window.command('stop')">Стоп</button>
        <button id="resume" type="button" class="button" hidden onclick="resumeProgram()">Вернуть управление программе</button>
        <button id="calibrate" type="button" class="button" onclick="location.assign('/calibrate.htm?address=' + selectedAddress)">Калибровка внешнего насоса</button>
      </div>
      <div id="relays" class="i2c-actions">
        <button id="relay1" type="button" class="button" onclick="toggleRelay(1)">Реле 1</button>
        <button id="relay2" type="button" class="button" onclick="toggleRelay(2)">Реле 2</button>
        <button id="relay3" type="button" class="button" onclick="toggleRelay(3)">Реле 3</button>
        <button id="relay4" type="button" class="button" onclick="toggleRelay(4)">Реле 4</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
