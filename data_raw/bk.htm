  <script>

    // ==================== POWER UNIT ===================================================================
<!--#include power_unit_hidden.htm-->
<!--#include power_unit_runtime_vars.htm-->

    var HeaterPowerOn = false;

    function check_program (str) {
      var arrayOfStrings = str.split("\n");
      var prevcnt = 0;
      var ret = true;
      var cnt;
      for (i = 0; i < arrayOfStrings.length; i++) {
        var arrayOfDelim = arrayOfStrings[i].split(";");
        cnt = arrayOfDelim.length;
        if (cnt == 1 && arrayOfDelim[0] != "" && i == arrayOfStrings.length - 1) ret = false;
        else if (prevcnt > 0 && cnt > 1) {
          if (prevcnt != cnt) ret = false;
        }
        prevcnt = cnt;
      }
      return ret;
    }

    function calc_program () {
      if (!check_program(document.getElementById('WProgram').value)) {
        SamovarApp.notify("Ошибка программы, проверьте её.", 1);
        return;
      }
      var t = document.getElementsByClassName("prgline");
      var k, s;
      s = "";
      for (i = 1; i < t.length; i++) {
        k = t[i].childNodes;
        for (j = 1; j < 7; j++) {
          s = s + k[j].value + ";";
        }
        s = s.slice(0, -1);
        s = s + "\n";
      }
      document.getElementById('WProgram').value = s;
      set_num();
    }


    async function set_program () {
      calc_program();
      try {
        const result = await SamovarApp.postProgram(document.forms.mainform);
        if (!result.ok) {
          SamovarApp.notify(result.err || 'Программа не принята.', 0);
          return;
        }
        SamovarApp.notify('Программа сохранена.', 2);
      } catch (e) {
        SamovarApp.notify('Ошибка сети: ' + e, 0);
      }
    };

    function setBKCommand () {
      var cmd = "startbk=";
      if (HeaterPowerOn) {
        if (!confirm("Выключить нагрев?")) return false;
        cmd = cmd + "0";
      } else {
        cmd = cmd + "1";
      }
      SamovarApp.sendCommand(cmd);
      return false;
    }


    function sendwaterpwm () {
      return SamovarApp.sendNumericCommand('watert', 'PWM', {
        label: 'ШИМ насоса воды', integer: true, min: 0, max: 1023
      });
    };

    async function sendvoltage () {
      return await SamovarApp.sendPowerCommand('Voltage', pwr_unit, powerInputMax, { successMessage: 'Команда принята.' });
    };



    function renderTelemetry(myObj) {
        {
          document.getElementById('version').textContent = myObj.version;
          document.getElementById('crnt_tm').textContent = myObj.crnt_tm;
          document.getElementById('stm').textContent = myObj.stm;
          document.getElementById('SteamTemp').innerHTML = myObj.SteamTemp.toFixed(3);
          document.getElementById('PipeTemp').innerHTML = myObj.PipeTemp.toFixed(3);
          document.getElementById('WaterTemp').innerHTML = myObj.WaterTemp.toFixed(3);
          document.getElementById('TankTemp').innerHTML = myObj.TankTemp.toFixed(3);
          document.getElementById('ACPTemp').innerHTML = myObj.ACPTemp.toFixed(3);
          document.getElementById('bme_pressure').innerHTML = myObj.bme_pressure.toFixed(3);
          document.getElementById('start_pressure').innerHTML = myObj.start_pressure.toFixed(3);
          document.getElementById('Status').textContent = myObj.Status;
          const boilingEvidence = [
            'ожидание подтверждения',
            'пар — более точный критерий',
            'царга — более точный критерий',
            'куб + вода — менее точный алгоритм',
            'куб — менее точный алгоритм',
            'вода — менее точный алгоритм'
          ];
          const evidenceText = boilingEvidence[myObj.BoilingEvidence] || 'неизвестно';
          document.getElementById('boiling_evidence').textContent =
            myObj.BoilingEvidence === 0 && !myObj.BoilingPrecisionSensorConfigured
              ? 'Подтверждение кипения: датчики пара/царги не настроены; используется менее точный алгоритм куб/вода'
              : 'Подтверждение кипения: ' + evidenceText;
          document.getElementById('boiling_evidence').dataset.precision =
            myObj.BoilingEvidence === 1 || myObj.BoilingEvidence === 2
              ? 'precise'
              : 'estimated';
          document.getElementById('current_power_volt').innerHTML = myObj.current_power_volt;
          document.getElementById('target_power_volt').innerHTML = myObj.target_power_volt;
          document.getElementById('current_power_mode').innerHTML = myObj.current_power_mode;
          document.getElementById('current_power_p').innerHTML = myObj.current_power_p;
          document.getElementById('WFtotalMl').innerHTML = myObj.WFtotalMl;
          document.getElementById('WFflowRate').innerHTML = myObj.WFflowRate;
          document.getElementById('bme_temp').innerHTML = myObj.bme_temp;
          document.getElementById('heap').innerHTML = myObj.heap;
          document.getElementById('rssi').innerHTML = myObj.rssi;
          document.getElementById('fr_bt').innerHTML = myObj.fr_bt;
          SamovarApp.setSoundEnabled(!!myObj.UseBBuzzer);

          if (myObj.Lstatus) {
            if (myObj.Lstatus != "") {
              document.getElementById('Lstatus').textContent = myObj.Lstatus;
            }
          }

          var dt = myObj.PipeTemp - myObj.SteamTemp;
          document.getElementById('DeltaTemp').innerHTML = dt.toFixed(3);

          if (myObj.WFflowRate === undefined) {
            document.getElementById('flowsensor').style = 'visibility: hidden; position: fixed;';
          } else {
            document.getElementById('flowsensor').style = '';
          }

          if (myObj.wp_spd === undefined) {
          } else {
            document.getElementById('add_param').innerHTML = "; ШИМ насоса воды: " + myObj.wp_spd;
          }

          SamovarApp.renderI2cPumpStatus(myObj);

          var powerstr;
          var powerstyle;
          HeaterPowerOn = myObj.PowerOn == 1;
          if (HeaterPowerOn) {
            powerstr = 'Выключить нагрев';
            powerstyle = SamovarApp.cssVar('--state-danger-bg');
          } else {
            powerstr = 'Включить нагрев';
            powerstyle = SamovarApp.cssVar('--state-active-bg');
          }
          document.getElementById('power').value = powerstr;
          document.getElementById('power').style.backgroundColor = powerstyle;

        }
    };

    function sliderChange () {
      document.getElementById('PWMt').value = document.getElementById('PWM').value;
      return sendwaterpwm();
    }

    function changetxtpwm () {
      var result = SamovarApp.readNumericInput('PWMt', {
        label: 'ШИМ насоса воды', integer: true, min: 0, max: 1023
      });
      if (!result) return false;
      document.getElementById('PWM').value = result.text;
      return sliderChange();
    }



    window.onload = function() {
      SamovarApp.startTelemetryPage(renderTelemetry, {
        threshold: 3,
        onReady: function() {
          setPowerUnit();
          SamovarApp.addLuaButtons();
        },
        storeMessageHistory: true,
        dynamicThemeTitle: false,
        implicitSystemTheme: false,
        staleReadingIds: ['SteamTemp', 'PipeTemp', 'WaterTemp', 'TankTemp', 'ACPTemp', 'DeltaTemp', 'bme_temp']
      });
    };

    document.addEventListener('DOMContentLoaded', function() {
      var slider = document.getElementById('PWM');
      slider.addEventListener("change", sliderChange);
      var txt = document.getElementById('PWMt');
      txt.value = document.getElementById('PWM').value;
    });

  </script>
</head>

<body>

      [x] очистить историю
    </button>

      <div class="container_row" style="margin-top: 1em; background-color: var(--bg-status); padding-top: 0.5em; padding-bottom: 0.5em;">
        <span style="padding-left: 1em; font-size: 1.5em; font-weight: bold; color: var(--text-status)">
          Статус: <span id='Status'></span>
        </span>
      </div>
      <div id="boiling_evidence" class="text" data-precision="estimated"
           style="padding: 0.5em 1em;">Подтверждение кипения: ожидание</div>

      <div class="container_row" style="border: 1px dashed #bbb; margin-bottom: 1em; justify-content: space-between;">
        <div class="text" id='WaterH2'>
          <div class="container_row" style="padding-left: 2em; justify-content: space-around; align-items:center;">
            <div>
              <span id="pump-speed-label">Скорость насоса:</span>
              <input name='PWM' id='PWM' type='range' min="%PWM_LV%" max="1023" value='%PWM_V%' list="tickmarks" onchange='sliderChange();' aria-labelledby="pump-speed-label">
              <datalist id="tickmarks">
                <option value="%PWM_LV%">
                <option value="300">
                <option value="500">
                <option value="700">
                <option value="900">
                <option value="1023">
              </datalist>
            </div>
            <input id='PWMt' type='text' inputmode='decimal' name='PWMt' value='' onchange='changetxtpwm();' aria-labelledby="pump-speed-label">
          </div>
        </div>

      </div>

      <div id="PWR" class="container_column" style="border: 1px dashed #bbb; align-items: center; margin-top: 1em; margin-bottom: 1em; padding-top: 1em;">
        <div id='VoltH2' class="container_row" style="justify-content: center; margin-top: 1em;">
          <div class="flex_row">
            <label class="text" id='set_power_label' for="Voltage"></label>
            <input name='Voltage' id='Voltage' type='text' inputmode='decimal' value=''>

          </div>
        </div>
        <div id='regulator' class='container_row' style="justify-content: space-around; font-size: 1.4em; font-weight: bold; margin-top: 1em;">
          <div class='flex_row'>
            <span id='power_current'></span>
            <span id='current_power_volt'></span>

          </div>
          <div class='flex_row'>
            <span id='power_target'></span>
            <span id='target_power_volt'></span>
            <span id='power_unit_target'></span>
          </div>
          <div class='flex_row'>
            Режим регулятора: <span id='current_power_mode'></span>
          </div>
        </div>
        <div class="container_row" style="justify-content: center; font-size: 1.6em; font-weight: bold;">
          <span class='dvcs' id='current_power_line'>
            Мощность: <span id='current_power_p'></span> Вт
          </span>
        </div>
      </div>

      <div class="container_row" style="border: 1px dashed #bbb; margin-bottom: 1em; justify-content: space-between;">
        <div class="text">
          Давление: &nbsp;
          <span id='bme_pressure'></span>
          мм рт.ст.
        </div>
        <div class="text">
          В начале: &nbsp;
          <span id='start_pressure'></span>
          мм рт.ст.
        </div>

      <div>
        <span class='dvcs'>Системные параметры: Heap=<span id='heap'></span>; BME temp=<span id='bme_temp'></span>; RSSI = <span id='rssi'></span>; Свободно: <span id='fr_bt'></span><span id='add_param'></span></span>

      <section id='i2c_pump_status' class='container_row' aria-label='Состояние I2C-насоса' hidden>
