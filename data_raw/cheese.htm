  <link rel="stylesheet" href="style.css?v=7.00u7">
  <title>Самовар — сыроварение</title>
  <script type="application/json" id="samovar_lua_btn_list"></script>
  <script src="app.js"></script>
  <style>
    /* Строка этапа - сетка: №, тип, четыре поля с подписями, мешалка, «+», «−».
       В разметке мешалка стоит между третьим и четвёртым полем - в сетку она
       ставится последней через order. Скрытые поля оставляют пустую ячейку
       (visibility), чтобы колонки у всех строк совпадали, как в таблицах других
       режимов; общий [hidden] {display:none !important} здесь перебивается.
       Отступы 12px из общих правил .prgline не нужны - ширину задаёт сетка. */
    .cheese-row { display: grid; grid-template-columns: 2em minmax(8em, 1.2fr) repeat(4, minmax(5.5em, 1fr)) minmax(26em, 3fr) auto auto; align-items: end; gap: 6px 8px; margin-bottom: 8px !important; }
    .cheese-row input, .cheese-row select, .cheese-row label, .cheese-row .program-row-action { margin-left: 0 !important; }
    .cheese-row input, .cheese-row select { box-sizing: border-box; width: 100%; min-width: 0; }
    .cheese-row .cheese-row-number { width: auto !important; padding-bottom: .45em; }
    .cheese-row .program-row-action { align-self: center; grid-row: 1; }
    .cheese-row .cheese-add { grid-column: -3; }
    .cheese-row .cheese-remove { grid-column: -2; }
    .cheese-field, .cheese-mixer label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cheese-field label, .cheese-mixer label { font-size: .78em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cheese-row .cheese-field[hidden] { display: flex !important; visibility: hidden; }
    .cheese-mixer { order: 1; display: grid; grid-template-columns: minmax(5.5em, 1.2fr) minmax(3.5em, 1fr) minmax(6.5em, 1.3fr) minmax(3.5em, 1fr) minmax(3.5em, 1fr); gap: 6px 8px; min-width: 0; }
    .cheese-lua-call { grid-column: 1 / -1; }
    .cheese-help { line-height: 1.45; }
    /* Планшет: мешалка второй линией под полями этапа. */
    @media (max-width: 1100px) {
      .cheese-row { grid-template-columns: 2em minmax(8em, 1.2fr) repeat(4, minmax(5.5em, 1fr)) auto auto; }
      .cheese-row .cheese-mixer { grid-column: 2 / -3; }
    }
    /* Телефон: тип этапа во всю ширину, поля парами, мешалка в три колонки.
       Скрытые поля здесь не занимают место, а соседнее поле сдвигается влево. */
    @media (max-width: 640px) {
      .cheese-row { grid-template-columns: 2em repeat(2, minmax(0, 1fr)) auto auto; }
      .cheese-row .cheese-type { grid-column: 2 / -3; }
      .cheese-row .cheese-field[hidden] { display: none !important; }
      .cheese-row .cheese-field:has(.cheese-value1), .cheese-row .cheese-field:has(.cheese-value3) { grid-column: 2; }
      .cheese-row .cheese-field:has(.cheese-value2), .cheese-row .cheese-field:has(.cheese-value4) { grid-column: 3 / -1; }
      .cheese-row:has(.cheese-field[hidden] .cheese-value1) .cheese-field:has(.cheese-value2),
      .cheese-row:has(.cheese-field[hidden] .cheese-value3) .cheese-field:has(.cheese-value4) { grid-column: 2; }
      .cheese-row:has(.cheese-field[hidden] .cheese-value1) .cheese-field:has(.cheese-value3) { grid-column: 3 / -1; }
      .cheese-row .cheese-mixer { grid-column: 2 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
  <script>
    var CHEESE_PROGRAM_MAX_ROWS = 20;
    var CHEESE_PROGRAM_FIELDS = 6;
    // TYPE;VALUE1;VALUE2;VALUE3;MIXER;VALUE4
    var HeaterPowerOn = false;
    var CheesePhAvailable = true;
    var acceptedCheeseProgram = '';
    var CHEESE_TYPES = {
      H:{name:'Нагрев', labels:['Цель, °C','Тайм-аут, мин','Скорость, °C/мин','Датчик'], visible:[1,1,1,1], mixer:true, defaults:['30','60','1','0']},
      P:{name:'Выдержка', labels:['Цель, °C','Выдержка, мин','Общий тайм-аут, мин','Датчик'], visible:[1,1,1,1], mixer:true, defaults:['30','30','60','0']},
      C:{name:'Охлаждение', labels:['Цель, °C','Тайм-аут, мин','','Датчик'], visible:[1,1,0,1], mixer:true, defaults:['20','60','0','0']},
      M:{name:'Перемешивание', labels:['','Длительность, мин','',''], visible:[0,1,0,0], mixer:true, defaults:['0','10','0','0']},
      D:{name:'Дозирование', labels:['Объём, мл','Тайм-аут, мин','Скорость, мл/мин','Способ'], visible:[1,1,1,1], mixer:true, defaults:['10','30','10','2']},
      N:{name:'Ожидание pH', labels:['Температура, °C','Тайм-аут, мин','Целевой pH','Датчик'], visible:[1,1,1,1], mixer:true, defaults:['30','120','5.2','0']},
      W:{name:'Ручное действие', labels:['','Тайм-аут, мин','Действие',''], visible:[0,1,1,0], mixer:true, defaults:['0','30','1','0']},
      S:{name:'Слив', labels:['','Тайм-аут, мин','',''], visible:[0,1,0,0], mixer:false, defaults:['0','30','0','0']},
      L:{name:'Lua', labels:['','Тайм-аут, сек','',''], visible:[0,1,0,0], mixer:false, lua:true, defaults:['0','1','0','0']}
    };
    var SENSOR_NAMES = ['Куб','Вода','Царга','Пар','ТСА'];

    function programError(message) {
      SamovarApp.showRequestError(message);
      SamovarApp.notify(message, 1);
      return false;
    }

    function positive(value, max) { return Number.isFinite(value) && value > 0 && value <= max; }
    function integer(value, min, max) { return Number.isInteger(value) && value >= min && value <= max; }

    function mixerValues(row) {
      var speed = Number(row.mixerSpeed.value);
      if (Number(row.mixerDevice.value) === 2) speed = Math.abs(speed) * Number(row.mixerDirection.value);
      return [Number(row.mixerDevice.value), speed,
        Number(row.mixerOn.value), Number(row.mixerOff.value)];
    }

    function mixerText(row) { return mixerValues(row).join('^'); }

    function validateMixer(row, allowed) {
      var values = mixerValues(row);
      var device = values[0], speed = values[1], on = values[2], off = values[3];
      if (!allowed) return device === 0 && speed === 0 && on === 0 && off === 0;
      if (device === 0) return speed === 0 && on === 0 && off === 0;
      if (device !== 1 && device !== 2) return false;
      if (device === 1 && speed !== 0) return false;
      if (device === 2 && (!integer(speed, -65535, 65535) || speed === 0)) return false;
      if (!integer(on, 0, 65535) || !integer(off, 0, 65535)) return false;
      return on === 0 ? off === 0 : true;
    }

    function rowValues(row) {
      return [row.type.value, row.value1.value, row.value2.value,
        row.type.value === 'W' || (row.type.value === 'D' && row.value4.value === '1')
          ? row.actionCode.value : row.value3.value,
        row.type.value === 'L' ? row.luaCall.value : mixerText(row), row.value4.value];
    }

    function validateCheeseRow(values) {
      var type = values[0], rule = CHEESE_TYPES[type];
      var one = Number(values[1]), two = Number(values[2]), three = Number(values[3]);
      var mixerParts = String(values[4]).split('^'), four = Number(values[5]);
      if (type === 'L') {
        return one === 0 && integer(two, 1, 65535) && three === 0 && four === 0 &&
          /\.lua$/.test(mixerParts[0]) &&
          mixerParts.every(function(value) { return value !== ''; });
      }
      if (!rule || mixerParts.length !== 4 || mixerParts.some(function(value) { return value.trim() === ''; })) return false;
      var mixer = mixerParts.map(Number);
      if (mixer.some(function(value) { return !Number.isInteger(value); }) ||
          !Number.isFinite(one) || !Number.isFinite(two) || !Number.isFinite(three) || !Number.isFinite(four)) return false;
      var fakeRow = {mixerDevice:{value:mixer[0]}, mixerSpeed:{value:Math.abs(mixer[1])},
        mixerDirection:{value:mixer[1] < 0 ? '-1' : '1'}, mixerOn:{value:mixer[2]}, mixerOff:{value:mixer[3]}};
      if (!validateMixer(fakeRow, rule.mixer)) return false;
      if ((rule.visible[0] ? !positive(one, 150) : one !== 0) ||
          (rule.visible[1] ? !positive(two, 1440) : two !== 0) ||
          (!rule.visible[2] && three !== 0) || (!rule.visible[3] && four !== 0)) return false;
      if (type === 'H' && !positive(three, 150)) return false;
      if (type === 'P' && (!positive(three, 1440) || three < two)) return false;
      if (type === 'D' && !(positive(three, 65535) || integer(three, 1, 8)) ||
          (type === 'D' && !integer(four, 1, 2))) return false;
      if (type === 'D' && four === 1 && !integer(three, 1, 8)) return false;
      if (type === 'D' && four === 2 && !positive(three, 65535)) return false;
      if (type === 'N' && !positive(three, 14)) return false;
      if (type === 'W' && !integer(three, 1, 8)) return false;
      if ((type === 'H' || type === 'P' || type === 'C' || type === 'N') && !integer(four, 0, 4)) return false;
      return true;
    }

    function setField(row, index, label, visible) {
      var field = row.fields[index];
      field.hidden = !visible;
      field.querySelector('label').textContent = label;
      if (!visible) field.querySelector('input, select').value = '0';
    }

    function setValue4Options(row) {
      var type = row.type.value;
      var options = type === 'D' ? [['1','Вручную'],['2','Локальный шаговый двигатель']]
        : SENSOR_NAMES.map(function(name, index) { return [String(index), name]; });
      var previous = row.value4.value;
      row.value4.textContent = '';
      options.forEach(function(option) {
        var node = document.createElement('option');
        node.value = option[0]; node.textContent = option[1]; row.value4.appendChild(node);
      });
      row.value4.value = options.some(function(option) { return option[0] === previous; }) ? previous : options[0][0];
    }

    function updateDosingField(row) {
      var manual = row.value4.value === '1';
      row.fields[2].querySelector('label').textContent = manual ? 'Компонент' : 'Скорость, мл/мин';
      row.value3.hidden = manual;
      row.actionCode.hidden = !manual;
      row.value3.min = '0.01';
      row.value3.max = '65535';
      row.value3.step = '0.1';
      if (manual && !integer(Number(row.actionCode.value), 1, 8)) row.actionCode.value = '1';
      if (!manual && !positive(Number(row.value3.value), 65535)) row.value3.value = '10';
    }

    function applyRowRules(row, reset) {
      var rule = CHEESE_TYPES[row.type.value];
      if (!rule) return;
      setValue4Options(row);
      if (reset) {
        row.value1.value = rule.defaults[0]; row.value2.value = rule.defaults[1];
        row.value3.value = rule.defaults[2]; row.value4.value = rule.defaults[3];
        row.actionCode.value = rule.defaults[2];
        row.mixerDevice.value = rule.mixer ? '0' : '0';
        row.mixerSpeed.value = '0'; row.mixerDirection.value = '1'; row.mixerOn.value = '0'; row.mixerOff.value = '0';
        if (rule.lua) row.luaCall.value = '';
      }
      for (var index = 0; index < 4; index++) setField(row, index, rule.labels[index], !!rule.visible[index]);
      row.value3.hidden = row.type.value === 'W';
      row.actionCode.hidden = row.type.value !== 'W';
      if (row.type.value === 'W' && !integer(Number(row.actionCode.value), 1, 8)) row.actionCode.value = '1';
      row.mixer.hidden = !rule.mixer && !rule.lua;
      row.luaCall.hidden = !rule.lua;
      Array.from(row.mixer.querySelectorAll('label')).forEach(function(label) {
        label.hidden = !!rule.lua;
      });
      if (!rule.mixer) {
        row.mixerDevice.value = '0'; row.mixerSpeed.value = '0'; row.mixerDirection.value = '1'; row.mixerOn.value = '0'; row.mixerOff.value = '0';
      }
      if (row.type.value === 'D') updateDosingField(row);
    }

    function setCheeseRowNumbers() {
      Array.from(document.querySelectorAll('#programRows .cheese-row')).forEach(function(row, index) {
        var number = String(index + 1).padStart(2, '0');
        row.number.textContent = number;
        row.querySelector('.cheese-add').setAttribute('aria-label', 'Добавить строку после ' + number);
        row.querySelector('.cheese-remove').setAttribute('aria-label', 'Удалить строку ' + number);
      });
    }

    function addCheeseRow(values, afterRow) {
      var rows = document.getElementById('programRows');
      if (rows.children.length >= CHEESE_PROGRAM_MAX_ROWS) return programError('Можно добавить не больше 20 этапов.');
      var row = document.getElementById('cheeseRowTemplate').content.firstElementChild.cloneNode(true);
      row.number = row.querySelector('.cheese-row-number');
      row.type = row.querySelector('.cheese-type');
      row.fields = row.querySelectorAll('.cheese-field');
      row.value1 = row.querySelector('.cheese-value1');
      row.value2 = row.querySelector('.cheese-value2');
      row.value3 = row.querySelector('.cheese-value3');
      row.actionCode = row.querySelector('.cheese-action-code');
      row.value4 = row.querySelector('.cheese-value4');
      row.mixer = row.querySelector('.cheese-mixer');
      row.mixerDevice = row.querySelector('.cheese-mixer-device');
      row.mixerSpeed = row.querySelector('.cheese-mixer-speed');
      row.mixerDirection = row.querySelector('.cheese-mixer-direction');
      row.mixerOn = row.querySelector('.cheese-mixer-on');
      row.mixerOff = row.querySelector('.cheese-mixer-off');
      row.luaCall = row.querySelector('.cheese-lua-call');
      var plus = row.querySelector('.cheese-add');
      var minus = row.querySelector('.cheese-remove');
      var initial = values || ['H', '30', '60', '1', '0^0^0^0', '0'];
      row.type.value = initial[0];
      row.value1.value = initial[1]; row.value2.value = initial[2]; row.value3.value = initial[3];
      row.actionCode.value = initial[3]; row.value4.value = initial[5];
      var mixer = String(initial[4]).split('^');
      if (initial[0] === 'L') row.luaCall.value = initial[4];
      else {
        row.mixerDevice.value = mixer[0]; row.mixerSpeed.value = Math.abs(Number(mixer[1]));
        row.mixerDirection.value = Number(mixer[1]) < 0 ? '-1' : '1';
        row.mixerOn.value = mixer[2]; row.mixerOff.value = mixer[3];
      }
      row.luaCall.addEventListener('focus', function() {
        SamovarApp.openLuaProgramModal(row.luaCall, row.value2, function() {});
      });
      row.type.addEventListener('change', function() { applyRowRules(row, true); });
      row.value4.addEventListener('change', function() { if (row.type.value === 'D') updateDosingField(row); });
      plus.addEventListener('click', function() {
        addCheeseRow(null, row);
      });
      minus.addEventListener('click', function() {
        if (rows.children.length > 1) {
          row.remove();
          setCheeseRowNumbers();
        }
      });
      if (afterRow) afterRow.after(row);
      else rows.appendChild(row);
      applyRowRules(row, false);
      setCheeseRowNumbers();
      return row;
    }

    function parseCheeseProgram(program) {
      var text = String(program || '').trim();
      if (!text) return [];
      var lines = text.split(/\r?\n/);
      if (lines.length > CHEESE_PROGRAM_MAX_ROWS) throw new Error('В программе больше 20 этапов.');
      return lines.map(function(line, index) {
        var values = line.split(';');
        if (values.length !== CHEESE_PROGRAM_FIELDS || !validateCheeseRow(values)) {
          throw new Error('Ошибка в этапе ' + (index + 1) + '.');
        }
        return values;
      });
    }

    function serializeCheeseRows() {
      var rows = Array.from(document.querySelectorAll('#programRows .cheese-row'));
      var lines = rows.map(function(row, index) {
        var values = rowValues(row);
        if (!validateCheeseRow(values)) throw new Error('Проверьте поля этапа ' + (index + 1) + '.');
        return values.join(';');
      });
      return lines.join('\n') + (lines.length ? '\n' : '');
    }

    function renderProgram(program) {
      var parsed = parseCheeseProgram(program);
      var rows = document.getElementById('programRows');
      rows.textContent = '';
      (parsed.length ? parsed : [['H','30','60','1','0^0^0^0','0']]).forEach(function(values) {
        addCheeseRow(values);
      });
    }

    async function set_program() {
      try {
        var program = serializeCheeseRows();
        document.getElementById('WProgram').value = program;
        var result = await SamovarApp.postProgram(document.forms.mainform);
        if (!result.ok) return programError(result.err || 'Программа не применена.');
        acceptedCheeseProgram = program;
        SamovarApp.notify('Сырная программа применена.', 2);
        return true;
      } catch (error) {
        return programError(error.message || error);
      }
    }

    function SaveProgramToFile() {
      try {
        var program = serializeCheeseRows();
        var link = document.createElement('a');
        link.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(program);
        link.download = 'cheese-program.txt';
        document.body.appendChild(link); link.click(); link.remove();
      } catch (error) { programError(error.message || error); }
    }

    function loadFile(file) {
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var program = String(reader.result || '');
          parseCheeseProgram(program);
          renderProgram(program);
          document.getElementById('WProgram').value = program;
          SamovarApp.clearRequestError();
        } catch (error) { programError(error.message || error); }
      };
      reader.readAsText(file, 'UTF-8');
    }

    function renderTelemetry(data) {
      document.getElementById('crnt_tm').textContent = data.crnt_tm || '';
      document.getElementById('version').textContent = data.version || '';
      document.getElementById('stm').textContent = data.stm || '';
      document.getElementById('SteamTemp').textContent = Number(data.SteamTemp || 0).toFixed(2);
      document.getElementById('PipeTemp').textContent = Number(data.PipeTemp || 0).toFixed(2);
      document.getElementById('WaterTemp').textContent = Number(data.WaterTemp || 0).toFixed(2);
      document.getElementById('TankTemp').textContent = Number(data.TankTemp || 0).toFixed(2);
      document.getElementById('ACPTemp').textContent = Number(data.ACPTemp || 0).toFixed(2);
      document.getElementById('Status').textContent = data.Status || '';
      document.getElementById('bme_temp').textContent = data.bme_temp;
      document.getElementById('heap').textContent = data.heap;
      document.getElementById('rssi').textContent = data.rssi;
      document.getElementById('fr_bt').textContent = data.fr_bt;
      if (data.wp_spd !== undefined) document.getElementById('add_param').textContent = '; ШИМ насоса воды: ' + data.wp_spd;
      var acceptedRows = acceptedCheeseRows();
      var current = currentCheeseRow(data, acceptedRows);
      document.getElementById('stageType').textContent = current ? CHEESE_TYPES[current[0]].name : '—';
      document.getElementById('stageProgress').textContent = Number(data.WthdrwlProgress || 0).toFixed(0) + '\u0025';
      document.getElementById('cheesePh').textContent = data.CheesePhValid ? Number(data.CheesePh).toFixed(2) : 'нет данных';
      var hasTemperature = current && ['H','P','C','N'].indexOf(current[0]) >= 0;
      document.getElementById('stageTarget').textContent = hasTemperature ? current[1] : '—';
      document.getElementById('stageCurrent').textContent = hasTemperature ? currentSensorTemperature(current, data) : '—';
      document.getElementById('stageWorkTime').textContent = secondsText(data.CheeseWorkSeconds);
      document.getElementById('stageTimeout').textContent = secondsText(data.CheeseTimeoutRemainingSeconds);
      document.getElementById('stageWorkTimeCard').textContent = secondsText(data.CheeseWorkSeconds);
      document.getElementById('stageTimeoutCard').textContent = secondsText(data.CheeseTimeoutRemainingSeconds);
      document.getElementById('stageNumber').textContent = current ? (Number(data.ProgramNum) + ' из ' + acceptedRows.length) : '—';
      document.getElementById('stageLineOf').textContent = document.getElementById('stageNumber').textContent;
      document.getElementById('stageLineName').textContent = current ? CHEESE_TYPES[current[0]].name : '—';
      document.getElementById('stageNext').textContent = nextCheeseName(data, acceptedRows);
      document.getElementById('start').value = manualConfirmationRequired(current) ? 'Подтвердить' : 'Следующий этап';
      HeaterPowerOn = Number(data.PowerOn) === 1;
      document.getElementById('power').value = HeaterPowerOn ? 'Остановить сыроварение' : 'Начать сыроварение';
      SamovarApp.renderUiDetails(data);
    }

    function applyCheeseBootstrap(data) {
      if (typeof data.program !== 'string' || typeof data.luaButtonList !== 'string' || typeof data.version !== 'string') {
        throw new Error('неверный формат программы или Lua-кнопок.');
      }
      if (typeof data.cheesePhAvailable !== 'boolean' ||
          !Number.isInteger(Number(data.cheesePhAds1115Address))) {
        throw new Error('неверный источник pH.');
      }
      var coolingSchemes = {
        pump: 'насос',
        'two-valves': 'два клапана',
        unavailable: 'недоступно'
      };
      if (!Object.prototype.hasOwnProperty.call(coolingSchemes, data.cheeseCoolingScheme)) {
        throw new Error('неверная схема охлаждения.');
      }
      parseCheeseProgram(data.program);
      acceptedCheeseProgram = data.program;
      document.getElementById('WProgram').value = data.program;
      document.getElementById('samovar_lua_btn_list').textContent = JSON.stringify(data.luaButtonList);
      document.getElementById('SteamTemp').parentElement.style.color = data.steamColor;
      document.getElementById('PipeTemp').parentElement.style.color = data.pipeColor;
      document.getElementById('WaterTemp').parentElement.style.color = data.waterColor;
      document.getElementById('TankTemp').parentElement.style.color = data.tankColor;
      document.getElementById('ACPTemp').parentElement.style.color = data.acpColor;
      document.getElementById('version').textContent = data.version;
      document.getElementById('cheeseCoolingScheme').textContent = coolingSchemes[data.cheeseCoolingScheme];
      CheesePhAvailable = data.cheesePhAvailable;
      var address = Number(data.cheesePhAds1115Address);
      document.getElementById('power').disabled = !CheesePhAvailable;
      document.getElementById('cheesePhConnection').textContent = address > 0
        ? 'USE_ADS1115 автоматически переводит pH на AIN0 ADS1115 по адресу 0x' + address.toString(16).toUpperCase() + '. LUA_PIN остаётся свободным.'
        : 'Без USE_ADS1115 PH-4502C использует LUA_PIN через схему, безопасную для входа 3,3 В, и конфликтует с MPX5010DP.';
      document.getElementById('cheesePhAvailability').textContent = CheesePhAvailable
        ? '' : 'ADS1115 не найден. Запуск сыроварения заблокирован.';
      renderProgram(data.program);
    }

    function acceptedCheeseRows() {
      return parseCheeseProgram(acceptedCheeseProgram);
    }

    function currentCheeseRow(data, rows) {
      var index = Number(data.ProgramNum) - 1;
      return index >= 0 && index < rows.length ? rows[index] : null;
    }

    function currentSensorTemperature(row, data) {
      return Number(data[['TankTemp','WaterTemp','PipeTemp','SteamTemp','ACPTemp'][Number(row[5])]] || 0).toFixed(2);
    }

    function secondsText(value) {
      var seconds = Number(value);
      if (!Number.isFinite(seconds) || seconds < 0) return '—';
      var minutes = Math.floor(seconds / 60), rest = Math.floor(seconds % 60);
      return minutes + ' мин ' + rest + ' с';
    }

    function manualConfirmationRequired(row) {
      return row && (row[0] === 'W' || row[0] === 'S' || (row[0] === 'D' && row[5] === '1'));
    }

    function nextCheeseName(data, rows) {
      var index = Number(data.ProgramNum);
      if (!Number.isInteger(index) || index < 0 || index >= rows.length) return '—';
      return CHEESE_TYPES[rows[index][0]].name;
    }

    window.onload = async function() {
      if (!await SamovarApp.loadUiBootstrap(applyCheeseBootstrap)) return;
      SamovarApp.startTelemetryPage(renderTelemetry, {
        threshold:3,
        onReady:function() {
          SamovarApp.addLuaButtons();
        },
        storeMessageHistory:true
      });
    };
  </script>
