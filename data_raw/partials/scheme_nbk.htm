        <section class="scheme sec-scheme" id="sec-scheme">
          <svg viewBox="0 0 460 560" role="img" aria-label="Схема непрерывной бражной колонны: подача браги, колонна, холодильник, отбор, слив барды">
            <defs>
              <linearGradient id="liq" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e5a35a" stop-opacity=".55"/><stop offset="1" stop-color="#b8641f" stop-opacity=".9"/></linearGradient>
              <pattern id="pack" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--border-dashed)" stroke-width="1.2"/></pattern>
              <clipPath id="cubeClip"><rect x="172" y="410" width="140" height="110" rx="12"/></clipPath>
            </defs>
            <!-- Вода охлаждения -->
            <path class="pipe" d="M258 120 H400 V440 H352"/>
            <path class="pipe" d="M258 74 H420 V480 H352"/>
            <path class="flow" data-on="_flowOn" d="M352 440 H400 V120 H258"/>
            <path class="flow reverse" data-on="_flowOn" d="M258 74 H420 V480 H352"/>
            <text class="tag-lbl" x="410" y="300" transform="rotate(90 410 300)" text-anchor="middle">вода охлаждения</text>
            <!-- ТСА -->
            <path class="pipe" d="M228 40 V30 H300 V230"/>
            <rect class="metal" x="292" y="150" width="16" height="60" rx="3"/>
            <g transform="translate(312 196)"><rect class="tag-bg" x="0" y="-11" width="72" height="30" rx="6"/><text class="tag-lbl" x="8" y="0">ТСА</text><text class="tag" x="8" y="14" fill="var(--acp)"><tspan data-tele="ACPTemp" data-fmt="1"></tspan>°</text></g>
            <!-- Холодильник -->
            <rect class="metal" x="182" y="62" width="76" height="66" rx="8"/>
            <path class="pipe-thin" d="M196 72 h48 M196 86 h48 M196 100 h48 M196 114 h48"/>
            <rect class="metal" x="212" y="40" width="16" height="22" rx="3"/>
            <g transform="translate(96 34)"><rect class="tag-bg" x="0" y="-11" width="90" height="30" rx="6"/><text class="tag-lbl" x="8" y="0">Пар</text><text class="tag" x="8" y="14" fill="var(--steam)"><tspan data-tele="SteamTemp" data-fmt="2"></tspan>°</text></g>
            <line x1="186" y1="46" x2="212" y2="46" stroke="var(--border-dashed)" stroke-width="1.5"/>
            <g transform="translate(300 96)"><rect class="tag-bg" x="0" y="-11" width="90" height="30" rx="6"/><text class="tag-lbl" x="8" y="0">Вода</text><text class="tag" x="8" y="14" fill="var(--water)"><tspan data-tele="WaterTemp" data-fmt="1"></tspan>°</text></g>
            <!-- Колонна -->
            <rect class="metal" x="202" y="128" width="36" height="282" rx="4"/>
            <rect x="206" y="132" width="28" height="274" fill="url(#pack)"/>
            <g class="bubbles" data-on="_running" style="--rise:-264px;--rise-time:4s">
              <circle class="bubble" cx="214" cy="396" r="2"/><circle class="bubble" cx="224" cy="400" r="2.5"/><circle class="bubble" cx="219" cy="404" r="1.6"/>
            </g>
            <g transform="translate(250 300)"><rect class="tag-bg" x="0" y="-11" width="90" height="30" rx="6"/><text class="tag-lbl" x="8" y="0">Колонна</text><text class="tag" x="8" y="14" fill="var(--pipe)"><tspan data-tele="PipeTemp" data-fmt="2"></tspan>°</text></g>
            <line x1="238" y1="300" x2="250" y2="300" stroke="var(--border-dashed)" stroke-width="1.5"/>
            <!-- Подача браги: насос слева, ввод в середину колонны -->
            <circle class="metal" cx="80" cy="250" r="24"/>
            <g class="rotor" data-on="_pumpOn"><circle cx="80" cy="236" r="4"/><circle cx="92" cy="257" r="4"/><circle cx="68" cy="257" r="4"/></g>
            <path class="pipe" d="M104 250 H202"/>
            <path class="feed" data-on="_pumpOn" d="M104 250 H202"/>
            <path class="pipe" d="M80 274 V330"/>
            <g transform="translate(20 300)"><rect class="tag-bg" x="0" y="-11" width="120" height="30" rx="6"/><text class="tag-lbl" x="8" y="0">Подача браги</text><text class="tag tag-sm" x="8" y="14"><tspan data-tele="ISspd" data-fmt="1"></tspan> л/ч</text></g>
            <g transform="translate(20 340)"><rect class="tag-bg" x="0" y="-11" width="120" height="30" rx="6"/><text class="tag-lbl" x="8" y="0">Брага</text><text class="tag" x="8" y="14" fill="var(--tank)"><tspan data-tele="TankTemp" data-fmt="1"></tspan>°</text></g>
            <text class="tag-lbl" x="80" y="222" text-anchor="middle">насос браги</text>
            <!-- Отбор продукта -->
            <path class="pipe" d="M182 122 H150 V452"/>
            <path class="feed" data-on="_running" d="M182 122 H150 V452"/>
            <g class="drops" data-on="_running"><circle class="drop" cx="150" cy="458" r="3"/><circle class="drop" cx="150" cy="458" r="2.2"/></g>
            <g transform="translate(112 486)" data-on="_running"><rect class="jar" x="0" y="0" width="40" height="48" rx="4"/><rect class="jar-fill" x="2" y="20" width="36" height="26" rx="3"/><text class="tag-lbl jar-lbl" x="20" y="60" text-anchor="middle">продукт</text></g>
            <!-- Низ колонны: парогенератор/куб и слив барды -->
            <rect class="metal" x="172" y="410" width="140" height="110" rx="12"/>
            <g clip-path="url(#cubeClip)"><rect class="liquid" x="172" y="470" width="140" height="50"/></g>
            <path class="heater" data-on="_heaterOn" d="M192 500 c8 -10 16 10 24 0 s16 10 24 0 s16 10 24 0 s16 10 24 0"/>
            <text class="tag-lbl" x="242" y="430" text-anchor="middle" data-tele="_pressureLabel"></text>
            <text class="tag tag-sm" x="242" y="446" text-anchor="middle"><tspan data-tele="_pressureAlt" data-fmt="1"></tspan> мм рт.ст.</text>
            <text class="tag-lbl" x="242" y="536" text-anchor="middle">нагрев</text>
            <text class="tag tag-sm power-text" data-on="_heaterOn" x="242" y="552" text-anchor="middle" data-tele="_heaterText"></text>
            <path class="pipe" d="M312 500 H360 V530"/>
            <g class="drops" data-on="_running"><circle class="drop" cx="360" cy="534" r="3"/></g>
            <text class="tag-lbl" x="360" y="556" text-anchor="middle">барда</text>
            <g class="pause-badge" data-on="_paused" transform="translate(30 380)"><rect x="0" y="0" width="72" height="18" rx="4"/><text x="36" y="13" text-anchor="middle">ПАУЗА</text></g>
          </svg>
        </section>
