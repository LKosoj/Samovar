<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset='utf-8'>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/>
<link rel="stylesheet" href="style.css?v=7.00u7">
<title>Самовар</title>
<script src="app.js"></script>
<script>
let localStepsPerMl = 0;
let externalAddress = 0;
let externalStepsPerMl = 0;
let calibrationRunning = false;
let calibrationInFlight = false;
let externalLeaseTimer = 0;

function externalCalibration() {
  return externalAddress !== 0;
}

function touchExternalLease() {
  if (!externalCalibration() || !calibrationRunning) return;
  fetch('/i2cstepper?address=' + externalAddress + '&cmd=lease', {
    cache: 'no-store'
  }).catch(() => {});
}

function updateExternalLease() {
  clearInterval(externalLeaseTimer);
  externalLeaseTimer = 0;
  if (!externalCalibration() || !calibrationRunning) return;
  touchExternalLease();
  externalLeaseTimer = window.setInterval(touchExternalLease, 2000);
}

function updateCalibrationButton() {
  const running = calibrationRunning;
  document.getElementById('calibrateid').value = running
    ? 'Зафиксировать 100 мл' : 'Начать калибровку';
  document.getElementById('calibrateid').disabled = calibrationInFlight;
  document.getElementById('kstepperspd').disabled = running || calibrationInFlight;
  const save = document.getElementById('save');
  if (save) save.disabled = running || calibrationInFlight;
}

async function readExternalCalibration() {
  const response = await fetch('/i2cstepper?address=' + externalAddress, {
    cache: 'no-store'
  });
  if (!response.ok) {
    throw new Error(await SamovarApp.responseErrorText(
      response, 'Не удалось перечитать внешний насос'
    ));
  }
  const payload = await response.json();
  const device = payload.selected;
  if (!device || !device.present || (device.address & 1) || !device.config ||
      !Number.isInteger(Number(device.config.stepsPerMl)) ||
      Number(device.config.stepsPerMl) <= 0) {
    throw new Error('Внешний I2C-насос недоступен или не откалиброван.');
  }
  externalStepsPerMl = Number(device.config.stepsPerMl);
  document.getElementById('stepperstepml').value = String(externalStepsPerMl);
}

async function calibrate() {
  if (calibrationInFlight) return false;
  const wasRunning = calibrationRunning;
  const params = new URLSearchParams();
  if (externalCalibration()) params.set('address', String(externalAddress));
  else params.set('pump', 'local');
  if (wasRunning) {
    params.set('finish', '1');
  } else {
    const speed = SamovarApp.readNumericInput('kstepperspd', {
      label: 'Скорость шагового двигателя', integer: true, min: 1, max: 8000
    });
    if (!speed) return false;
    params.set('stpstep', speed.text);
    params.set('start', '1');
  }
  calibrationInFlight = true;
  updateCalibrationButton();
  try {
    const response = await fetch('/calibrate?' + params.toString());
    if (!response.ok) {
      SamovarApp.showRequestError(await SamovarApp.responseErrorText(
        response, 'Калибровка не принята'
      ));
      return false;
    }
    const acceptance = await SamovarApp.readOperationAcceptance(response);
    await SamovarApp.waitForOperation(acceptance.operationId);
    calibrationRunning = !wasRunning;
    updateExternalLease();
    if (!calibrationRunning) {
      if (externalCalibration()) {
        await readExternalCalibration();
      } else {
        const confirmed = await fetch('/ajax?messageCursor=0', {cache: 'no-store'});
        const payload = await confirmed.json();
        localStepsPerMl = Number(payload.StepperStepMl);
        document.getElementById('stepperstepml').value = String(localStepsPerMl * 100);
      }
    }
    SamovarApp.clearRequestError();
    return true;
  } catch (error) {
    SamovarApp.showRequestError('Ошибка сети при калибровке: ' + error);
    return false;
  } finally {
    calibrationInFlight = false;
    updateCalibrationButton();
  }
}

async function saveCalibration(event) {
  event.preventDefault();
  if (externalCalibration() || calibrationRunning || calibrationInFlight) return false;
  const steps = SamovarApp.readNumericInput('stepperstepml', {
    label: 'Шагов на 100 мл', integer: true, min: 100, max: 6553500,
    accept: value => value % 100 === 0,
    acceptMessage: 'Поле «Шагов на 100 мл» должно быть кратно 100.'
  });
  if (!steps) return false;
  calibrationInFlight = true;
  updateCalibrationButton();
  try {
    const response = await fetch('/save', {
      method: 'POST', body: new URLSearchParams({StepperStepMl: String(steps.number / 100)})
    });
    if (!response.ok) {
      SamovarApp.showRequestError(await SamovarApp.responseErrorText(
        response, 'Настройки не сохранены'
      ));
      return false;
    }
    const acceptance = await SamovarApp.readOperationAcceptance(response);
    await SamovarApp.waitForOperation(acceptance.operationId);
    localStepsPerMl = steps.number / 100;
    SamovarApp.clearRequestError();
    return true;
  } catch (error) {
    SamovarApp.showRequestError('Настройки не сохранены: ' + error);
    return false;
  } finally {
    calibrationInFlight = false;
    updateCalibrationButton();
  }
}

window.onload = async function() {
  SamovarApp.initTheme();
  const params = new URLSearchParams(
    typeof location === 'undefined' ? '' : location.search
  );
  const rawAddress = params.get('address');
  if (rawAddress !== null) {
    const parsed = Number(rawAddress);
    if (!Number.isInteger(parsed) || parsed < 1 || parsed > 10 || (parsed & 1)) {
      SamovarApp.showRequestError('Неверный адрес внешнего I2C-насоса.');
      return;
    }
    externalAddress = parsed;
    document.getElementById('save').remove();
    document.getElementById('title').textContent = 'Калибровка внешнего I2C-насоса';
    document.getElementById('steps-label').textContent = 'Шагов/мл в Nano:';
    document.getElementById('stepperstepml').readOnly = true;
    document.getElementById('return').onclick = () => location.assign(
      '/i2cstepper.htm?address=' + externalAddress
    );
    try {
      let bootstrap = null;
      if (!await SamovarApp.loadUiBootstrap(data => { bootstrap = data; })) return;
      calibrationRunning = Boolean(bootstrap.calibrationRunning);
      if (bootstrap.processRunning || calibrationRunning) {
        SamovarApp.showRequestError('Калибровка внешнего насоса сейчас недоступна.');
        return;
      }
      document.getElementById('kstepperspd').value = String(bootstrap.stepperMaxSpeed);
      await readExternalCalibration();
    } catch (error) {
      SamovarApp.showRequestError(String(error));
      return;
    }
  } else {
    let bootstrap = null;
    if (!await SamovarApp.loadUiBootstrap(data => { bootstrap = data; })) return;
    localStepsPerMl = Number(bootstrap.stepperStepsPerMl);
    calibrationRunning = Boolean(bootstrap.calibrationRunning);
    document.getElementById('kstepperspd').value = String(bootstrap.stepperMaxSpeed);
    document.getElementById('stepperstepml').value = String(localStepsPerMl * 100);
  }
  document.forms.setupform.addEventListener('submit', saveCalibration);
  updateCalibrationButton();
};
window.addEventListener('beforeunload', () => clearInterval(externalLeaseTimer));
</script>
</head>
<body>
<!--#include ui_page_header.htm-->
    <button type="button" id="themeToggle" class="icon-btn theme-toggle" onclick="SamovarApp.toggleTheme()" title="Переключить тему">☾</button>
  </header>
<form action='/save' method="post" name="setupform">
<h1 id="title">Калибровка шагового двигателя</h1>
<div class="tabcontent" style="display: block;border-top: solid;border-top-width: 1px;border-top-color: rgb(204, 204, 204);">
<h2>Объем жидкости : <span>100</span> мл.</h2>
<h2><label for="kstepperspd">Скорость шагового двигателя :</label> <input id='kstepperspd' type='text' inputmode='numeric' value='' style="width: 6em;"> шагов/сек.</h2>
<h2><label id="steps-label" for="stepperstepml">Шагов на 100 мл:</label> <input id='stepperstepml' type='text' inputmode='numeric' value='' style="width: 6em;"></h2>
<input id='calibrateid' type='button' value='Начать калибровку' onclick='calibrate();' class="button">
<input id='save' type='submit' value='Сохранить' class="button">
<input id='return' type='button' value='К настройкам' onclick='location.href="/setup.htm"' class="button">
</div>
</form>
</body>
</html>
