<!--#include head_boilerplate.htm-->
  <link rel="stylesheet" href="style.css?v=7.00u7">
  <title>Самовар — калибровка pH</title>
  <script src="app.js"></script>
  <script>
    var latestPh = {raw:null, value:null, rawValid:false, valid:false};
    var calibrationPoints = [null, null];
    var phAvailable = true;

    function applyPhCalibrationBootstrap(data) {
      if (typeof data.cheesePhAvailable !== 'boolean' ||
          !Number.isInteger(Number(data.cheesePhAds1115Address))) {
        throw new Error('неверный источник pH.');
      }
      document.getElementById('CheesePhSlope').value = String(data.cheesePhSlope);
      document.getElementById('CheesePhOffset').value = String(data.cheesePhOffset);
      phAvailable = data.cheesePhAvailable;
      var address = Number(data.cheesePhAds1115Address);
      document.getElementById('phConnection').textContent = address > 0
        ? 'USE_ADS1115 автоматически переводит pH на AIN0 ADS1115 по адресу 0x' + address.toString(16).toUpperCase() + '. LUA_PIN для pH не используется.'
        : 'Без USE_ADS1115 PH-4502C подключается к LUA_PIN через согласование уровня до 3,3 В и конфликтует с MPX5010DP.';
      ['point1Ph', 'point2Ph', 'capturePoint1', 'capturePoint2', 'calculatePh',
       'CheesePhSlope', 'CheesePhOffset', 'savePh'].forEach(function(id) {
        document.getElementById(id).disabled = !phAvailable;
      });
      if (!phAvailable) {
        var message = 'ADS1115 не найден. Калибровка pH недоступна.';
        document.getElementById('phStatus').textContent = message;
        SamovarApp.showRequestError(message);
      }
    }

    function phError(message) {
      SamovarApp.showRequestError(message);
      document.getElementById('phStatus').textContent = message;
      return false;
    }

    function renderCalibrationTelemetry(data) {
      if (!phAvailable) return;
      latestPh.raw = Number(data.CheesePhRaw);
      latestPh.value = Number(data.CheesePh);
      latestPh.rawValid = Number(data.CheesePhRawValid) === 1 && Number.isFinite(latestPh.raw);
      latestPh.valid = Number(data.CheesePhValid) === 1;
      document.getElementById('phRaw').textContent = latestPh.rawValid ? String(latestPh.raw) : 'нет данных';
      document.getElementById('phCurrent').textContent = latestPh.valid && Number.isFinite(latestPh.value) ? latestPh.value.toFixed(2) : 'нет данных';
    }

    function capturePhPoint(index) {
      if (!phAvailable) return phError('ADS1115 не найден. Калибровка pH недоступна.');
      var input = document.getElementById(index === 0 ? 'point1Ph' : 'point2Ph');
      var phText = String(input.value).trim();
      var ph = Number(phText.replace(',', '.'));
      if (!latestPh.rawValid || !phText || !Number.isFinite(ph) || ph < 0 || ph > 14) return phError('Нужны свежий ADC и pH от 0 до 14.');
      calibrationPoints[index] = {raw:latestPh.raw, ph:ph};
      document.getElementById(index === 0 ? 'point1Raw' : 'point2Raw').textContent = String(latestPh.raw);
      document.getElementById('phStatus').textContent = 'Точка ' + (index + 1) + ' зафиксирована.';
      SamovarApp.clearRequestError();
      return true;
    }

    function calculatePhCalibration() {
      if (!phAvailable) return phError('ADS1115 не найден. Калибровка pH недоступна.');
      var first = calibrationPoints[0];
      var second = calibrationPoints[1];
      if (!first || !second) return phError('Сначала зафиксируйте две точки.');
      if (first.ph === second.ph) return phError('Значения pH двух точек должны различаться.');
      if (first.raw === second.raw) return phError('Значения ADC двух точек должны различаться.');
      var slope = (second.ph - first.ph) / (second.raw - first.raw);
      var offset = first.ph - slope * first.raw;
      if (!Number.isFinite(slope) || !Number.isFinite(offset) || slope === 0) return phError('Не удалось рассчитать коэффициенты.');
      document.getElementById('CheesePhSlope').value = slope.toFixed(6);
      document.getElementById('CheesePhOffset').value = offset.toFixed(6);
      document.getElementById('phStatus').textContent = 'Коэффициенты рассчитаны. Сохраните их.';
      SamovarApp.clearRequestError();
      return true;
    }

    async function savePhCalibration() {
      if (!phAvailable) return phError('ADS1115 не найден. Калибровка pH недоступна.');
      var slopeText = String(document.getElementById('CheesePhSlope').value).trim();
      var offsetText = String(document.getElementById('CheesePhOffset').value).trim();
      var slope = Number(slopeText);
      var offset = Number(offsetText);
      if (!slopeText || !offsetText || !Number.isFinite(slope) || !Number.isFinite(offset) || slope === 0) {
        return phError('Проверьте коэффициенты.');
      }
      var button = document.getElementById('savePh');
      button.disabled = true;
      try {
        var response = await fetch('/save', {method:'POST', body:new FormData(document.getElementById('phForm'))});
        var accepted = await SamovarApp.readOperationAcceptance(response);
        await SamovarApp.waitForOperation(accepted.operationId);
        SamovarApp.clearRequestError();
        document.getElementById('phStatus').textContent = 'Калибровка сохранена.';
        return true;
      } catch (error) {
        return phError('Калибровка не сохранена: ' + (error.message || error));
      } finally { button.disabled = false; }
    }

    window.onload = async function() {
      if (!await SamovarApp.loadUiBootstrap(applyPhCalibrationBootstrap)) return;
      SamovarApp.startTelemetryPage(renderCalibrationTelemetry, {threshold:3, storeMessageHistory:false});
    };
  </script>
</head>
<body>
<!--#include ui_page_header.htm-->
    <button type="button" id="themeToggle" class="icon-btn theme-toggle" onclick="SamovarApp.toggleTheme()" title="Переключить тему">☾</button>
  </header>
  <form id="phForm" onsubmit="return false">
    <h1>Калибровка pH</h1>
    <div class="tabcontent" style="display: block;border-top: solid;border-top-width: 1px;border-top-color: rgb(204, 204, 204);">
    <div id="connection_indicator"><img src="Green.png" alt="Связь" style="width:20px"></div>
    <div id="request_error" class="message_0" role="alert" aria-live="assertive" style="display:none"></div>
    <div>
      <input type="button" class="button" value="К сыроварению" onclick="location.href='/cheese.htm'">
      <input type="button" class="button" value="Настройки" onclick="location.href='/setup.htm'">
    </div>
    <div class="container_row" style="border: 1px dashed #bbb; margin: 1em 0; padding: 1em;">
      <span class="text">Текущее значение: <strong id="phCurrent">нет данных</strong> pH · ADC: <strong id="phRaw">нет данных</strong></span>
    </div>
    <div class="container_column" style="border: 1px dashed #bbb; margin-bottom: 1em; padding: 1em;">
      <p>Промойте электрод, поместите его в буфер и дождитесь стабильного ADC. Повторите для второго буфера.</p>
      <div class="container_row">
        <label class="text" for="point1Ph">pH первой точки:</label>
        <input id="point1Ph" type="number" min="0" max="14" step="0.01" value="7.00">
        <span class="text">ADC: <strong id="point1Raw">—</strong></span>
        <button type="button" class="button" id="capturePoint1" onclick="capturePhPoint(0)">Зафиксировать</button>
      </div>
      <div class="container_row">
        <label class="text" for="point2Ph">pH второй точки:</label>
        <input id="point2Ph" type="number" min="0" max="14" step="0.01" value="4.00">
        <span class="text">ADC: <strong id="point2Raw">—</strong></span>
        <button type="button" class="button" id="capturePoint2" onclick="capturePhPoint(1)">Зафиксировать</button>
      </div>
      <button type="button" class="button" id="calculatePh" onclick="calculatePhCalibration()">Рассчитать</button>
    </div>
    <div class="container_column" style="border: 1px dashed #bbb; margin-bottom: 1em; padding: 1em;">
      <div class="container_row">
        <label class="text" for="CheesePhSlope">Коэффициент k:</label><input id="CheesePhSlope" name="CheesePhSlope" type="number" step="0.000001" value="">
      </div>
      <div class="container_row">
        <label class="text" for="CheesePhOffset">Смещение d:</label><input id="CheesePhOffset" name="CheesePhOffset" type="number" step="0.000001" value="">
      </div>
      <button type="button" class="button" id="savePh" onclick="savePhCalibration()">Сохранить калибровку</button>
      <p id="phStatus" role="status" aria-live="polite"></p>
    </div>
    <div id="phConnection" class="container_row" style="border: 1px dashed #bbb; padding: 1em;"></div>
    </div>
  </form>
</body>
</html>
