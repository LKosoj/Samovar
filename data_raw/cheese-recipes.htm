<!--#include head_boilerplate.htm-->
  <link rel="stylesheet" href="style.css?v=7.00u7">
  <title>Самовар — рецепты сыра</title>
  <script src="app.js"></script>
  <style>
    .recipes-page { max-width: 1180px; margin: 1.25rem auto; padding: 0 1rem 2rem; }
    .recipes-grid { display: grid; grid-template-columns: minmax(240px, .8fr) minmax(0, 1.4fr); gap: 1rem; align-items: start; }
    .recipes-toolbar, .recipes-tabs, .recipes-pager, .recipes-actions { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    .recipes-toolbar input { flex: 1 1 14rem; }
    .recipes-tabs button[aria-pressed="true"] { background: var(--accent-hover); color: var(--text-on-accent); }
    .recipe-list { display: grid; gap: .55rem; margin-top: 1rem; }
    .recipe-list button { width: 100%; text-align: left; background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-card); border-radius: var(--radius-sm); padding: .75rem; cursor: pointer; }
    .recipe-list button[aria-current="true"] { border-color: var(--copper); box-shadow: 0 0 0 2px rgba(184,100,31,.18); }
    .recipe-list small { display: block; color: var(--text-muted); margin-top: .25rem; }
    .recipe-empty, .recipe-status { color: var(--text-muted); }
    .recipe-status[data-kind="error"], .warnings li { color: var(--warn); }
    .recipe-status[data-kind="ok"] { color: var(--ok); }
    .temperature-choices { display: grid; gap: .5rem; margin: .75rem 0; }
    .temperature-choice { display: grid; grid-template-columns: 1fr minmax(7rem, 10rem); gap: .75rem; align-items: center; }
    .program-preview { width: 100%; min-height: 12rem; box-sizing: border-box; font-family: monospace; resize: vertical; }
    .warnings { margin: .75rem 0; padding-left: 1.25rem; }
    .recipe-meta { color: var(--text-muted); margin-top: -.4rem; }
    @media (max-width: 760px) { .recipes-grid { grid-template-columns: 1fr; } .temperature-choice { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<!--#include ui_page_header.htm-->
    <div class="theme-switch" aria-label="Тема">
      <button type="button" class="theme-btn" data-theme-choice="light" title="Светлая тема">☀</button>
      <button type="button" class="theme-btn" data-theme-choice="dark" title="Тёмная тема">☾</button>
    </div>
  </header>
  <main class="recipes-page">
    <h1>Рецепты сыра</h1>
    <p>Выберите рецепт с samovar-tool.ru или откройте локальный файл <code>cheesexml.xml</code>. Файл и токен обрабатываются только в памяти браузера.</p>
    <div class="recipes-grid">
      <section class="card" aria-labelledby="catalog-title">
        <h2 id="catalog-title">Каталог</h2>
        <div class="recipes-tabs" role="group" aria-label="Источник рецептов">
          <button type="button" class="button" data-catalog="main" aria-pressed="true">Основные</button>
          <button type="button" class="button secondary" data-catalog="user" aria-pressed="false">Пользовательские</button>
          <button type="button" class="button secondary" data-catalog="my" aria-pressed="false">Мои</button>
        </div>
        <form id="recipeSearch" class="recipes-toolbar">
          <input id="recipeQuery" type="search" maxlength="200" placeholder="Поиск рецепта" aria-label="Поиск рецепта">
          <button class="button secondary" type="submit">Найти</button>
        </form>
        <label class="button secondary" for="recipeFile">Открыть CheeseXML</label>
        <input id="recipeFile" type="file" accept=".xml,application/xml,text/xml">
        <div id="recipeList" class="recipe-list"></div>
        <div class="recipes-pager">
          <button id="recipePrev" class="button secondary" type="button">Назад</button>
          <span id="recipePage">—</span>
          <button id="recipeNext" class="button secondary" type="button">Вперёд</button>
        </div>
      </section>

      <section class="card" aria-labelledby="preview-title">
        <h2 id="preview-title">Программа</h2>
        <h3 id="recipeName">Рецепт не выбран</h3>
        <p id="recipeMeta" class="recipe-meta"></p>
        <div id="temperatureChoices" class="temperature-choices"></div>
        <div class="recipes-actions">
          <button id="convertRecipe" class="button secondary" type="button" disabled>Преобразовать</button>
        </div>
        <ul id="recipeWarnings" class="warnings"></ul>
        <textarea id="programPreview" class="program-preview" readonly aria-label="Предварительный просмотр программы"></textarea>
        <div class="recipes-actions">
          <button id="applyRecipe" class="button primary" type="button" disabled>Применить программу</button>
          <a class="button secondary" href="/cheese.htm">Открыть редактор</a>
        </div>
        <p id="recipeStatus" class="recipe-status" role="status"></p>
      </section>
    </div>
  </main>

<script>
(function () {
  'use strict';

  var API_BASE = 'https://www.samovar-tool.ru/cheesexml/v1/';
  var PROGRAM_MAX = 20;
  var state = { catalog: 'main', page: 1, perPage: 10, total: 0, query: '', recipe: null, conversion: null, token: '', mode: null, applying: false };

  function byId(id) { return document.getElementById(id); }
  function finite(value) {
    if (value === null || value === undefined || value === '') return null;
    var number = Number(value);
    return Number.isFinite(number) ? number : null;
  }
  function compactNumber(value) { return Number(value.toFixed(6)).toString(); }
  function localized(value) {
    if (typeof value === 'string') return value;
    if (!Array.isArray(value)) return '';
    var item = value.find(function (entry) { return entry && entry.lang === 'ru'; }) ||
      value.find(function (entry) { return entry && entry.primary; }) || value[0];
    return item && typeof item.text === 'string' ? item.text : '';
  }
  function directChildren(node, name) {
    return Array.prototype.filter.call(node ? node.children : [], function (child) { return child.localName === name; });
  }
  function directChild(node, name) { return directChildren(node, name)[0] || null; }
  function xmlLocalized(node) {
    var values = directChildren(node, 'T');
    var chosen = values.find(function (entry) { return entry.getAttributeNS('http://www.w3.org/XML/1998/namespace', 'lang') === 'ru'; }) ||
      values.find(function (entry) { return entry.getAttribute('primary') === 'true'; }) || values[0];
    return chosen ? chosen.textContent.trim() : '';
  }
  function xmlQuantity(node) {
    if (!node) return null;
    return {
      value: finite(node.getAttribute('value')),
      min: finite(node.getAttribute('min')),
      max: finite(node.getAttribute('max')),
      si: finite(node.getAttribute('si')),
      unit: node.getAttribute('unit') || ''
    };
  }
  function normalizeQuantity(value) {
    if (!value || typeof value !== 'object') return null;
    return { value: finite(value.value), min: finite(value.min), max: finite(value.max), si: finite(value.si), unit: String(value.unit || '') };
  }
  function normalizeStep(step, index) {
    var ph = step.pH || step.ph;
    return {
      n: finite(step.n) || index + 1,
      phase: String(step.phase || ''),
      code: String(step.code || ''),
      name: localized(step.name) || String(step.name || ('Этап ' + (index + 1))),
      instruction: localized(step.instruction) || String(step.instruction || ''),
      temp: normalizeQuantity(step.temp),
      time: normalizeQuantity(step.time),
      pH: ph && typeof ph === 'object' ? { value: finite(ph.value), min: finite(ph.min), max: finite(ph.max) } : null,
      floc: step.floc && typeof step.floc === 'object' ? {
        time: finite(step.floc.time), unit: String(step.floc.unit || ''), multiplier: finite(step.floc.multiplier)
      } : null
    };
  }
  function normalizeJson(payload) {
    var outer = payload && payload.content ? payload : { content: payload || {} };
    var content = outer.content || {};
    if (!Array.isArray(content.process)) throw new Error('В рецепте нет технологических этапов.');
    return {
      id: outer.id || content.id || '',
      name: outer.name || localized(content.name) || 'Без названия',
      process: content.process.map(normalizeStep),
      aging: Array.isArray(content.aging) ? content.aging.slice() : []
    };
  }
  function normalizeXml(text) {
    var documentXml = new DOMParser().parseFromString(String(text || ''), 'application/xml');
    if (documentXml.querySelector('parsererror')) throw new Error('XML содержит синтаксическую ошибку.');
    var root = documentXml.documentElement;
    if (!root || root.localName !== 'CHEESEXML') throw new Error('Ожидается корень CHEESEXML.');
    var version = root.getAttribute('version') || '';
    if (!/^1(?:\.|$)/.test(version)) throw new Error('Поддерживается только CheeseXML 1.x.');
    var recipes = directChild(root, 'RECIPES');
    var recipe = directChild(recipes, 'RECIPE');
    if (!recipe) throw new Error('В CheeseXML нет RECIPE.');
    var process = directChild(recipe, 'PROCESS');
    var steps = directChildren(process, 'STEP').map(function (step, index) {
      var params = directChild(step, 'PARAMS');
      var phNode = directChild(params, 'PH');
      var flocNode = directChild(params, 'FLOC');
      return normalizeStep({
        n: step.getAttribute('n'), phase: step.getAttribute('phase'), code: step.getAttribute('code'),
        name: xmlLocalized(directChild(step, 'NAME')) || ('Этап ' + (index + 1)),
        instruction: xmlLocalized(directChild(step, 'INSTRUCTION')),
        temp: xmlQuantity(directChild(params, 'TEMP')),
        time: xmlQuantity(directChild(params, 'TIME')),
        pH: phNode ? { value: finite(phNode.getAttribute('value')), min: finite(phNode.getAttribute('min')), max: finite(phNode.getAttribute('max')) } : null,
        floc: flocNode ? { time: finite(flocNode.getAttribute('time')), unit: flocNode.getAttribute('unit'), multiplier: finite(flocNode.getAttribute('multiplier')) } : null
      }, index);
    });
    if (!steps.length) throw new Error('В рецепте нет технологических этапов.');
    return { id: recipe.getAttribute('id') || '', name: xmlLocalized(directChild(recipe, 'NAME')) || 'Без названия', process: steps, aging: directChildren(directChild(recipe, 'AGING'), 'STAGE') };
  }

  function toCelsius(value, unit) {
    if (!Number.isFinite(value)) return null;
    if (String(unit).toLowerCase() === 'f') return (value - 32) * 5 / 9;
    if (!unit || String(unit).toLowerCase() === 'c') return value;
    return null;
  }
  function temperatureBounds(quantity) {
    if (!quantity) return null;
    var value = quantity.si !== null ? quantity.si : toCelsius(quantity.value, quantity.unit);
    var min = toCelsius(quantity.min, quantity.unit);
    var max = toCelsius(quantity.max, quantity.unit);
    return { value: value, min: min, max: max };
  }
  function timeMinutes(quantity, preferMax) {
    if (!quantity) return null;
    var value = preferMax && quantity.max !== null ? quantity.max : quantity.value;
    if (value === null) value = quantity.max !== null ? quantity.max : quantity.min;
    if (!Number.isFinite(value) || value <= 0) return null;
    var unit = quantity.unit.toLowerCase();
    if (unit === 's' || unit === 'sec') return value / 60;
    if (unit === 'h' || unit === 'hr') return value * 60;
    if (unit === 'd') return value * 1440;
    return unit === 'min' || unit === '' ? value : null;
  }
  function manualAction(step) {
    var code = step.code.toLowerCase();
    if (/culture|starter/.test(code)) return 1;
    if (/rennet|coagulant/.test(code)) return 2;
    if (/add|salt|acid/.test(code)) return 3;
    if (/cut/.test(code)) return 4;
    if (/form|mould|mold/.test(code)) return 5;
    if (/press/.test(code)) return 6;
    if (/flip|turn/.test(code)) return 7;
    return 8;
  }
  function validTemperature(value) { return Number.isFinite(value) && value > 0 && value <= 150; }
  function validMinutes(value) { return Number.isFinite(value) && value > 0 && value <= 1440; }
  function validMultiplier(value) {
    var milli = Number.isFinite(value) ? Math.floor(value * 1000 + 0.5) : 0;
    return Number.isSafeInteger(milli) && milli >= 1000 && milli <= 0xFFFFFFFF;
  }
  function selectedTemperature(step, choices) {
    var bounds = temperatureBounds(step.temp);
    if (!bounds) return null;
    if (validTemperature(bounds.value)) return bounds.value;
    var chosen = finite(choices[String(step.n)]);
    if (!validTemperature(chosen)) return null;
    if (bounds.min !== null && chosen < bounds.min) return null;
    if (bounds.max !== null && chosen > bounds.max) return null;
    return chosen;
  }
  function makeManual(step, warnings) {
    var timeout = timeMinutes(step.time, true);
    if (!validMinutes(timeout)) { timeout = 30; warnings.push('Этап «' + step.name + '»: для ручного действия установлен тайм-аут 30 мин.'); }
    warnings.push('Этап «' + step.name + '» не поддерживается автоматикой и преобразован в ручное действие.');
    return 'W;0;' + compactNumber(timeout) + ';' + manualAction(step) + ';0^0^0^0;0';
  }
  function convertRecipe(recipe, choices) {
    var warnings = [], rows = [], lastTemperature = null, blocked = false;
    recipe.process.forEach(function (step) {
      var bounds = temperatureBounds(step.temp);
      var directTemperature = selectedTemperature(step, choices || {});
      if (bounds && bounds.value === null && (bounds.min !== null || bounds.max !== null) && directTemperature === null) {
        warnings.push('Этап «' + step.name + '»: выберите одно значение температуры из диапазона.');
        blocked = true;
      }
      if (directTemperature !== null) lastTemperature = directTemperature;
      var target = directTemperature !== null ? directTemperature : lastTemperature;
      var timeout = timeMinutes(step.time, true);
      var code = step.code.toLowerCase();
      var handled = false;

      if (step.pH && Number.isFinite(step.pH.value) && step.pH.value > 0 && step.pH.value <= 14 && validTemperature(target)) {
        var phTimeout = timeout;
        if (directTemperature === null) warnings.push('Этап «' + step.name + '»: используется температура предыдущего этапа ' + compactNumber(target) + ' °C.');
        if (!validMinutes(phTimeout)) { phTimeout = 120; warnings.push('Этап «' + step.name + '»: установлен тайм-аут pH 120 мин.'); }
        rows.push({ source: step.name, line: 'N;' + compactNumber(target) + ';' + compactNumber(phTimeout) + ';' + compactNumber(step.pH.value) + ';0^0^0^0;0' });
        warnings.push('Этап «' + step.name + '»: условие pH ≤ ' + compactNumber(step.pH.value) + ' удерживается 30 с.');
        handled = true;
      }
      if (step.floc) {
        var multiplier = step.floc.multiplier;
        if (!validTemperature(target) || !validMultiplier(multiplier)) {
          rows.push({ source: step.name, line: makeManual(step, warnings) });
        } else {
          var flocTimeout = timeout;
          if (!validMinutes(flocTimeout)) {
            var flocTime = timeMinutes({ value: step.floc.time, min: null, max: null, si: null, unit: step.floc.unit }, false);
            flocTimeout = flocTime && validMinutes(flocTime * multiplier) ? flocTime * multiplier : 60;
            warnings.push('Этап «' + step.name + '»: тайм-аут флока рассчитан из ожидаемого времени либо установлен 60 мин.');
          }
          rows.push({ source: step.name, line: 'F;' + compactNumber(target) + ';' + compactNumber(flocTimeout) + ';' + compactNumber(multiplier) + ';0^0^0^0;0' });
        }
        handled = true;
      }
      if (!handled && directTemperature !== null) {
        if (/cool|chill/.test(code)) {
          if (!validMinutes(timeout)) { timeout = 60; warnings.push('Этап «' + step.name + '»: установлен тайм-аут охлаждения 60 мин.'); }
          rows.push({ source: step.name, line: 'C;' + compactNumber(directTemperature) + ';' + compactNumber(timeout) + ';0;0^0^0^0;0' });
        } else {
          var hold = timeMinutes(step.time, false);
          if (validMinutes(hold) && hold < 1440) {
            var totalTimeout = Math.min(1440, hold + 60);
            rows.push({ source: step.name, line: 'P;' + compactNumber(directTemperature) + ';' + compactNumber(hold) + ';' + compactNumber(totalTimeout) + ';0^0^0^0;0' });
            warnings.push('Этап «' + step.name + '»: к выдержке добавлен запас тайм-аута 60 мин.');
          } else {
            rows.push({ source: step.name, line: 'H;' + compactNumber(directTemperature) + ';60;1;0^0^0^0;0' });
            warnings.push('Этап «' + step.name + '»: для нагрева установлены тайм-аут 60 мин и скорость 1 °C/мин.');
          }
        }
      } else if (!handled) {
        rows.push({ source: step.name, line: makeManual(step, warnings) });
      }
    });
    if (recipe.aging && recipe.aging.length) warnings.push('Стадии созревания исключены из программы Самовара.');
    if (rows.length > PROGRAM_MAX) warnings.push('В программе больше ' + PROGRAM_MAX + ' этапов; применение недоступно.');
    return { rows: rows, warnings: warnings, program: rows.map(function (row) { return row.line; }).join('\n') + (rows.length ? '\n' : ''), valid: !blocked && rows.length > 0 && rows.length <= PROGRAM_MAX };
  }

  function status(message, kind) { byId('recipeStatus').textContent = message || ''; byId('recipeStatus').dataset.kind = kind || ''; }
  function authHeaders() { return state.token ? { Authorization: 'Bearer ' + state.token } : {}; }
  async function jsonRequest(url, options) {
    var response = await fetch(url, options || {});
    var body = await response.json().catch(function () { return {}; });
    if (!response.ok) throw new Error(body.message || ('HTTP ' + response.status));
    return body;
  }
  function catalogUrl() {
    var path = state.catalog === 'my' ? 'me/recipes' : 'recipes';
    var url = new URL(path, API_BASE);
    if (state.catalog !== 'my') {
      url.searchParams.set('catalog', state.catalog);
      if (state.query) url.searchParams.set('q', state.query);
    }
    url.searchParams.set('page', state.page);
    url.searchParams.set('perPage', state.perPage);
    return url.toString();
  }
  async function loadCatalog() {
    if (state.catalog === 'my' && !state.token) { status('Для списка «Мои» в устройстве не задан токен Blynk.', 'error'); renderList([]); return; }
    status('Загрузка…');
    try {
      var page = await jsonRequest(catalogUrl(), state.catalog === 'my' ? { headers: authHeaders() } : {});
      state.total = Number(page.total) || 0;
      var items = Array.isArray(page.items) ? page.items : [];
      if (state.catalog === 'my' && state.query) {
        var query = state.query.toLocaleLowerCase('ru');
        items = items.filter(function (item) { return String(item.name || '').toLocaleLowerCase('ru').indexOf(query) !== -1; });
      }
      renderList(items);
      status('Найдено: ' + state.total, 'ok');
    } catch (error) { renderList([]); status('Каталог: ' + error.message, 'error'); }
  }
  function renderList(items) {
    var list = byId('recipeList'); list.textContent = '';
    items.forEach(function (item) {
      var button = document.createElement('button'); button.type = 'button';
      button.textContent = item.name || item.slug || ('Рецепт ' + item.id);
      var meta = document.createElement('small'); meta.textContent = [item.family, item.style, item.country].filter(Boolean).join(' · ');
      button.appendChild(meta);
      button.addEventListener('click', function () { selectRemoteRecipe(item, button); });
      list.appendChild(button);
    });
    if (!items.length) { var empty = document.createElement('p'); empty.className = 'recipe-empty'; empty.textContent = 'Рецепты не найдены.'; list.appendChild(empty); }
    var pages = Math.max(1, Math.ceil(state.total / state.perPage));
    byId('recipePage').textContent = state.page + ' / ' + pages;
    byId('recipePrev').disabled = state.page <= 1;
    byId('recipeNext').disabled = state.page >= pages;
  }
  async function selectRemoteRecipe(item, button) {
    status('Загрузка рецепта…');
    try {
      var isMine = state.catalog === 'my';
      var path = isMine ? 'me/recipes/' + encodeURIComponent(item.id) : 'recipes/' + encodeURIComponent(item.slug);
      var payload = await jsonRequest(new URL(path, API_BASE).toString(), isMine ? { headers: authHeaders() } : {});
      Array.prototype.forEach.call(byId('recipeList').querySelectorAll('button'), function (entry) { entry.removeAttribute('aria-current'); });
      button.setAttribute('aria-current', 'true');
      setRecipe(normalizeJson(payload), isMine ? 'Мой рецепт' : 'Каталог ' + state.catalog);
    } catch (error) { status('Рецепт: ' + error.message, 'error'); }
  }
  function setRecipe(recipe, source) {
    state.recipe = recipe; state.conversion = null;
    byId('recipeName').textContent = recipe.name;
    byId('recipeMeta').textContent = source + ' · этапов: ' + recipe.process.length;
    byId('programPreview').value = '';
    byId('recipeWarnings').textContent = '';
    renderTemperatureChoices(recipe);
    byId('convertRecipe').disabled = false;
    byId('applyRecipe').disabled = true;
    status('Проверьте температуры и нажмите «Преобразовать».');
  }
  function renderTemperatureChoices(recipe) {
    var host = byId('temperatureChoices'); host.textContent = '';
    recipe.process.forEach(function (step) {
      var bounds = temperatureBounds(step.temp);
      if (!bounds || bounds.value !== null || (bounds.min === null && bounds.max === null)) return;
      var label = document.createElement('label'); label.className = 'temperature-choice';
      var caption = document.createElement('span'); caption.textContent = step.name + ': выберите температуру' +
        (bounds.min !== null || bounds.max !== null ? ' (' + (bounds.min === null ? '…' : compactNumber(bounds.min)) + '–' + (bounds.max === null ? '…' : compactNumber(bounds.max)) + ' °C)' : '');
      var input = document.createElement('input'); input.type = 'number'; input.step = '0.1'; input.min = bounds.min === null ? '0.1' : compactNumber(bounds.min); input.max = bounds.max === null ? '150' : compactNumber(bounds.max); input.dataset.step = String(step.n);
      label.appendChild(caption); label.appendChild(input); host.appendChild(label);
    });
  }
  function temperatureChoices() {
    var result = {};
    Array.prototype.forEach.call(byId('temperatureChoices').querySelectorAll('input[data-step]'), function (input) { result[input.dataset.step] = input.value; });
    return result;
  }
  function renderConversion() {
    if (!state.recipe) return;
    var conversion = convertRecipe(state.recipe, temperatureChoices());
    state.conversion = conversion;
    byId('programPreview').value = conversion.program;
    var warnings = byId('recipeWarnings'); warnings.textContent = '';
    conversion.warnings.forEach(function (message) { var item = document.createElement('li'); item.textContent = message; warnings.appendChild(item); });
    byId('applyRecipe').disabled = !conversion.valid || state.mode !== 7;
    status(conversion.valid ? (state.mode === 7 ? 'Предпросмотр готов. Программа ещё не применена.' : 'Для применения переключите Самовар в режим «Сыр».') : 'Преобразование нельзя применить.', conversion.valid ? '' : 'error');
  }
  async function applyProgram() {
    if (state.applying || !state.conversion || !state.conversion.valid || state.mode !== 7) return;
    state.applying = true; byId('applyRecipe').disabled = true; status('Применение…');
    try {
      var body = new FormData(); body.append('WProgram', state.conversion.program);
      var response = await fetch('/program', { method: 'POST', body: body });
      var result = await response.json().catch(function () { return {}; });
      if (!response.ok || result.ok === false) throw new Error(result.err || result.error || ('HTTP ' + response.status));
      status('Программа принята устройством. Запуск не выполнялся.', 'ok');
    } catch (error) { status('Программа не применена: ' + error.message, 'error'); byId('applyRecipe').disabled = false; }
    finally { state.applying = false; }
  }
  async function readLocalFile(file) {
    var text = await new Promise(function (resolve, reject) {
      var reader = new FileReader(); reader.onload = function () { resolve(String(reader.result || '')); }; reader.onerror = function () { reject(new Error('Не удалось прочитать файл.')); }; reader.readAsText(file, 'UTF-8');
    });
    setRecipe(normalizeXml(text), 'Локальный CheeseXML');
  }

  document.querySelectorAll('[data-catalog]').forEach(function (button) {
    button.addEventListener('click', function () {
      state.catalog = button.dataset.catalog; state.page = 1;
      document.querySelectorAll('[data-catalog]').forEach(function (entry) { entry.setAttribute('aria-pressed', entry === button ? 'true' : 'false'); });
      loadCatalog();
    });
  });
  byId('recipeSearch').addEventListener('submit', function (event) { event.preventDefault(); state.query = byId('recipeQuery').value.trim(); state.page = 1; loadCatalog(); });
  byId('recipePrev').addEventListener('click', function () { if (state.page > 1) { state.page--; loadCatalog(); } });
  byId('recipeNext').addEventListener('click', function () { if (state.page * state.perPage < state.total) { state.page++; loadCatalog(); } });
  byId('convertRecipe').addEventListener('click', renderConversion);
  byId('applyRecipe').addEventListener('click', applyProgram);
  byId('recipeFile').addEventListener('change', function () { if (this.files[0]) readLocalFile(this.files[0]).catch(function (error) { status(error.message, 'error'); }); });

  jsonRequest('/cheese-recipes-bootstrap', { cache: 'no-store' }).then(function (bootstrap) {
    state.token = typeof bootstrap.blynkToken === 'string' ? bootstrap.blynkToken : '';
    state.mode = Number(bootstrap.mode);
    loadCatalog();
  }).catch(function () { state.token = ''; state.mode = null; loadCatalog(); });
}());
</script>
</body>
</html>
