; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .
default_envs = Samovar

[env:Samovar]
platform = https://github.com/platformio/platform-espressif32/archive/3c076807e1f55b90799b50b946e76a0508e97778.zip
board = esp32doit-devkit-v1
framework = arduino
build_type = release
lib_ignore = 
	LiquidCrystal_I2C
	SoftI2CMaster
	WebServer
lib_extra_dirs = ./libraries
build_src_filter = +<*> -<libraries/> -<Lua_UART/> -<pro_mini_ntc/> -<Stab-avr/> -<core/>
board_build.partitions = partitions/samovar.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
platform_packages =
	tool-esp32partitiontool @ https://github.com/serifpersia/esp32partitiontool/releases/download/v1.4.4/esp32partitiontool-platformio.zip
	platformio/framework-arduinoespressif32 @ 3.20017.241212+sha.dcc1105b
	platformio/tool-esptoolpy @ 2.40900.250804
	platformio/tool-mkfatfs @ 2.0.1
	platformio/tool-mklittlefs @ 1.203.210628
	platformio/tool-mkspiffs @ 2.230.0
board_build.filesystem = littlefs
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-ffile-prefix-map=${platformio.packages_dir}=.platformio/packages
	-fdebug-prefix-map=${platformio.src_dir}=.
	-Os
	-DCONFIG_OPTIMIZATION_LEVEL_RELEASE=CONFIG_COMPILER_OPTIMIZATION_SIZE
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
	--specs=nano.specs
	-Wl,--print-memory-usage
	-Wl,-Map,firmware.map
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	; Штатные 200 уровней вложенных C-вызовов Lua рассчитаны на настольный стек.
	; На стеке задачи do_lua_script (8192 байта) он кончится раньше, чем сработает лимит,
	; поэтому лимит опущен до реально достижимого.
	-DLUAI_MAXCCALLS=60
	; Blynk.run() зовётся из loop() и на зависшем сокете блокирует его ровно на это время
	; (client->setTimeout). Заводские 6000 мс не влезают в бюджет одной итерации loop()
	; под сторожем LOOP_WDT_TIMEOUT_S. Флагом сборки, а не #define в Samovar.ino: logic.h
	; втягивает BlynkConfig.h раньше, где значение задано через #ifndef.
	; [Ревью 24.08, ошибка 1] Поднято с 2000UL до 3000UL: путь I2C-степпера
	; (i2c_stepper_send_command()/write_config()) теперь исключён из бюджета итерации
	; отдельным feedLoopWDT() (см. process_pending_i2c_operations() в Samovar.ino), а не
	; вычитается из общего порога вместе с Blynk - освободившийся запас переносим сюда.
	; При 3000UL (BlynkProtocol.h, libraries/Blynk/src/Blynk/): дисконнект по неактивности
	; 1000*BLYNK_HEARTBEAT(45) + 3*BLYNK_TIMEOUT_MS = 45000+9000 = 54000 мс (54 с); логин
	; Blynk.connect(BLYNK_TIMEOUT_MS) (Samovar.ino вызывает БЕЗ множителя x3 из дефолта
	; connect()) = 3000 мс (3 с).
	-DBLYNK_TIMEOUT_MS=3000UL
build_src_flags =
	-Wall
	-Wextra

[env:Samovar_s3]
extends = env:Samovar
board = esp32-s3-devkitc-1

[env:Samovar_no_power]
extends = env:Samovar
build_flags =
	${env:Samovar.build_flags}
	-DSAMOVAR_BUILD_NO_POWER

[env:Samovar_rmvk]
extends = env:Samovar
build_flags =
	${env:Samovar.build_flags}
	-DSAMOVAR_BUILD_RMVK

[env:Samovar_sem]
extends = env:Samovar
build_flags =
	${env:Samovar.build_flags}
	-DSAMOVAR_BUILD_SEM

[env:Samovar_lua_mqtt]
extends = env:Samovar
build_flags =
	${env:Samovar.build_flags}
	-DSAMOVAR_BUILD_LUA
	-DSAMOVAR_BUILD_MQTT

[env:Samovar_alarm_button]
extends = env:Samovar
build_flags =
	${env:Samovar.build_flags}
	-DUSE_ALARM_BTN
